<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Documents & Images — HQC CSSBF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display&display=swap">
<style>
:root {
  --ink:   #1A1714;
  --ink-2: #4A453E;
  --ink-3: #9A938A;
  --paper:   #F8F5F0;
  --paper-2: #EDE9E2;
  --paper-3: #E2DDD5;
  --accent:  #1D4E9F;
  --border:  rgba(0,0,0,0.09);
  --c-sit: #3A6FA8; --c-sit-bg: #E4EDF8;
  --c-esp: #3A8050; --c-esp-bg: #E2F0E6;
  --c-cau: #C06030; --c-cau-bg: #F8EBE0;
  --c-lnk: #C06030; --c-lnk-bg: #F8EBE0;
  --c-dif: #7A4A9A; --c-dif-bg: #EDE4F5;
  --c-chg: #607880; --c-chg-bg: #E6EAEC;
  --c-rel: #B03A3A; --c-rel-bg: #F5E4E4;
  --c-mr:  #2A8A8A; --c-mr-bg:  #DFF0F0;
  --c-fai: #9A6030; --c-fai-bg: #F2E8DC;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans','Segoe UI',Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}

header{background:#1B3B6F;color:var(--paper);padding:0 1.5rem;display:flex;align-items:stretch;min-height:52px}
.header-brand{display:flex;align-items:center;gap:.75rem;padding:.75rem 1.25rem .75rem 0;border-right:1px solid rgba(255,255,255,.15);margin-right:1rem}
.header-brand h1{font-family:'DM Serif Display',Georgia,serif;font-size:1.4rem;font-weight:400}
.header-brand small{font-size:.65rem;color:rgba(255,255,255,.6);letter-spacing:.08em;text-transform:uppercase;display:block;margin-top:1px}
nav{display:flex;align-items:center;gap:.25rem;margin-left:auto}
nav a{padding:.45rem .9rem;border-radius:6px;color:rgba(255,255,255,.75);text-decoration:none;font-size:.8rem;font-weight:500;transition:background .15s,color .15s;white-space:nowrap;cursor:pointer}
nav a:hover{background:rgba(255,255,255,.12);color:#fff}
nav a.active{background:rgba(255,255,255,.18);color:#fff}

.toolbar{background:var(--paper-2);border-bottom:1px solid var(--border);padding:.6rem 1.5rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.toolbar input,.toolbar select{padding:.38rem .75rem;border-radius:7px;border:1px solid var(--border);background:var(--paper);font-family:inherit;font-size:.8rem;color:var(--ink);outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
.toolbar input{width:200px}
.stat-chip{font-size:.75rem;color:var(--ink-3);margin-left:auto}
.stat-chip b{color:var(--ink-2)}

.section{padding:1.5rem}
.section-title{font-family:'DM Serif Display',Georgia,serif;font-size:1.1rem;font-weight:400;color:var(--ink-2);margin-bottom:1.25rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}

.shared-group{background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:1rem;overflow:hidden}
.shared-group-header{display:flex;align-items:center;gap:.9rem;padding:.75rem 1rem;background:var(--paper-2);border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.shared-group-header img{height:42px;width:68px;object-fit:cover;border-radius:5px;border:1px solid var(--border);flex-shrink:0;cursor:zoom-in}
.shared-group-header .img-label{font-size:.85rem;font-weight:500;color:var(--ink);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;justify-content:center;background:#1B3B6F;color:#fff;border-radius:20px;padding:.15rem .6rem;font-size:.7rem;font-weight:500;white-space:nowrap;flex-shrink:0}
.badge-single{background:var(--paper-3);color:var(--ink-3)}
.chevron{color:var(--ink-3);font-size:.8rem;margin-left:.25rem;transition:transform .2s;flex-shrink:0}
.shared-group-header.collapsed .chevron{transform:rotate(-90deg)}
.shared-group-body{padding:.85rem 1rem}
.tiles-row{display:flex;flex-wrap:wrap;gap:.6rem}

.tile{background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:.85rem;width:255px;flex-shrink:0;transition:box-shadow .15s,transform .15s}
.tile:hover{box-shadow:0 2px 12px rgba(0,0,0,.07);transform:translateY(-1px)}
.tile-top{display:flex;align-items:center;gap:.45rem;margin-bottom:.3rem;flex-wrap:wrap}
.tile-id{font-size:.7rem;font-weight:500;color:var(--ink-3);background:var(--paper-2);border-radius:4px;padding:.1rem .4rem;flex-shrink:0}
.tile-oi-tag{font-size:.67rem;font-weight:500;border-radius:20px;padding:.12rem .5rem;white-space:nowrap}
.tile-periode{font-size:.7rem;color:var(--ink-3);margin-bottom:.4rem}
.tile-enonce{font-size:.78rem;color:var(--ink-2);line-height:1.45;margin-bottom:.65rem}
.tile-imgs{display:flex;flex-wrap:wrap;gap:.4rem}
.img-wrap{display:flex;flex-direction:column;align-items:center;gap:.18rem;position:relative}
.img-wrap img{width:70px;height:46px;object-fit:cover;border-radius:5px;border:2px solid var(--border);cursor:zoom-in;transition:border-color .15s}
.img-wrap img:hover{border-color:var(--accent)}
.img-wrap.shared img{border-color:#C06030}
.img-wrap .img-name{font-size:.58rem;color:var(--ink-3);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.img-wrap .share-badge{position:absolute;top:-5px;right:-5px;background:#C06030;color:#fff;border-radius:50%;width:16px;height:16px;font-size:.6rem;font-weight:700;display:flex;align-items:center;justify-content:center}

/* Size badge */
.size-badge{display:inline-block;font-size:.62rem;font-weight:500;border-radius:10px;padding:.08rem .4rem;white-space:nowrap;flex-shrink:0}
.size-badge.ok{background:#D4EDDA;color:#276539}
.size-badge.warn{background:#FFF3CD;color:#856404}
.size-badge.big{background:#F8D7DA;color:#842029}
.size-badge.loading{background:var(--paper-3);color:var(--ink-3)}

/* Rename button */
.btn-rename,.btn-replace{background:none;border:none;cursor:pointer;color:var(--ink-3);font-size:.8rem;padding:.15rem .3rem;border-radius:4px;transition:color .15s,background .15s;flex-shrink:0;line-height:1}
.btn-rename:hover{color:var(--accent);background:rgba(29,78,159,.08)}
.btn-replace:hover{color:#276539;background:rgba(39,101,57,.08)}

.all-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.7rem}
.all-grid .tile{width:auto}

.oi-sit{color:var(--c-sit);background:var(--c-sit-bg)}
.oi-esp{color:var(--c-esp);background:var(--c-esp-bg)}
.oi-cau{color:var(--c-cau);background:var(--c-cau-bg)}
.oi-lnk{color:var(--c-lnk);background:var(--c-lnk-bg)}
.oi-dif{color:var(--c-dif);background:var(--c-dif-bg)}
.oi-chg{color:var(--c-chg);background:var(--c-chg-bg)}
.oi-rel{color:var(--c-rel);background:var(--c-rel-bg)}
.oi-fai{color:var(--c-fai);background:var(--c-fai-bg)}

#lb{display:none;position:fixed;inset:0;background:rgba(26,23,20,.88);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:.75rem}
#lb.open{display:flex}
#lb img{max-width:90vw;max-height:82vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
#lb-footer{display:flex;align-items:center;gap:.75rem}
#lb-caption{color:rgba(255,255,255,.55);font-size:.78rem}
#lb-size{font-size:.72rem;font-weight:500;border-radius:10px;padding:.1rem .5rem}
#lb-rename{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:.35rem .8rem;font-size:.78rem;cursor:pointer;font-family:inherit;transition:background .15s}
#lb-rename:hover{background:rgba(255,255,255,.22)}
#lb-close{position:fixed;top:1rem;right:1.5rem;font-size:2rem;cursor:pointer;color:rgba(255,255,255,.7);line-height:1}
#lb-close:hover{color:#fff}

/* Replace modal */
#replace-modal{display:none;position:fixed;inset:0;background:rgba(26,23,20,.6);z-index:1000;align-items:center;justify-content:center}
#replace-modal.open{display:flex}
.replace-box{background:#fff;border-radius:12px;padding:1.5rem;width:420px;max-width:92vw;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.replace-box h3{font-family:'DM Serif Display',Georgia,serif;font-size:1rem;font-weight:400;margin-bottom:.25rem}
.replace-box p{font-size:.78rem;color:var(--ink-3);margin-bottom:1rem}
.replace-drop{border:2px dashed var(--border);border-radius:8px;padding:1.25rem;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;margin-bottom:.9rem}
.replace-drop:hover,.replace-drop.drag{border-color:var(--accent);background:rgba(29,78,159,.04)}
.replace-drop input{display:none}
.replace-drop-label{font-size:.82rem;color:var(--ink-3)}
.replace-preview{display:none;flex-direction:column;align-items:center;gap:.6rem;margin-bottom:.9rem}
.replace-preview.show{display:flex}
.replace-preview img{max-width:100%;max-height:200px;border-radius:6px;border:1px solid var(--border)}
.replace-preview-meta{font-size:.75rem;color:var(--ink-3);text-align:center}
.replace-actions{display:flex;gap:.6rem;justify-content:flex-end}
.replace-actions button{padding:.42rem .95rem;border-radius:7px;font-family:inherit;font-size:.8rem;font-weight:500;cursor:pointer;border:1px solid transparent;transition:background .15s}
.replace-status{font-size:.78rem;margin-top:.6rem;min-height:1.2em;text-align:right}
.replace-status.err{color:#842029}
.replace-status.ok{color:#276539}

/* Rename modal */
#rename-modal{display:none;position:fixed;inset:0;background:rgba(26,23,20,.6);z-index:1000;align-items:center;justify-content:center}
#rename-modal.open{display:flex}
.rename-box{background:#fff;border-radius:12px;padding:1.5rem;width:380px;max-width:92vw;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.rename-box h3{font-family:'DM Serif Display',Georgia,serif;font-size:1rem;font-weight:400;margin-bottom:.25rem}
.rename-box p{font-size:.78rem;color:var(--ink-3);margin-bottom:1rem}
.rename-box input{width:100%;padding:.5rem .75rem;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:.85rem;color:var(--ink);outline:none;margin-bottom:1rem}
.rename-box input:focus{border-color:var(--accent)}
.rename-actions{display:flex;gap:.6rem;justify-content:flex-end}
.rename-actions button{padding:.42rem .95rem;border-radius:7px;font-family:inherit;font-size:.8rem;font-weight:500;cursor:pointer;border:1px solid transparent;transition:background .15s}
.btn-cancel{background:var(--paper-2);color:var(--ink-2);border-color:var(--border)}
.btn-cancel:hover{background:var(--paper-3)}
.btn-confirm{background:#1B3B6F;color:#fff}
.btn-confirm:hover{background:#163264}
.btn-confirm:disabled{opacity:.5;cursor:not-allowed}
.rename-status{font-size:.78rem;margin-top:.6rem;min-height:1.2em;text-align:right}
.rename-status.err{color:#842029}
.rename-status.ok{color:#276539}
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <div>
      <h1>HQC · CSSBF</h1>
      <small>Documents &amp; Images</small>
    </div>
  </div>
  <nav>
    <a id="nav-shared" class="active" onclick="setActive('shared')">Toutes les images</a>
    <a id="nav-all" onclick="setActive('all')">Toutes les questions</a>
  </nav>
</header>

<div class="toolbar">
  <input type="search" id="search" placeholder="Rechercher…" oninput="filterAll()">
  <select id="filterOi" onchange="filterAll()"><option value="">Toutes les OI</option></select>
  <span class="stat-chip" id="stat-chip"></span>
</div>

<div id="sec-shared" class="section">
  <div class="section-title">Toutes les images</div>
  <div id="shared-container"></div>
</div>
<div id="sec-all" class="section" style="display:none">
  <div class="section-title">Toutes les questions avec image</div>
  <div class="all-grid" id="allGrid"></div>
</div>

<div id="lb" onclick="closeLb(event)">
  <span id="lb-close">&times;</span>
  <img id="lb-img" src="">
  <div id="lb-footer">
    <span id="lb-caption"></span>
    <span id="lb-size" class="size-badge loading"></span>
    <button id="lb-rename" onclick="event.stopPropagation();openRename(currentLbImg)">✏ Renommer</button>
    <button id="lb-replace" onclick="event.stopPropagation();openReplace(currentLbImg)" style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:.35rem .8rem;font-size:.78rem;cursor:pointer;font-family:inherit;transition:background .15s">⇪ Remplacer</button>
  </div>
</div>

<!-- Replace modal -->
<div id="replace-modal" onclick="closeReplaceModal(event)">
  <div class="replace-box" onclick="event.stopPropagation()">
    <h3>Remplacer l'image</h3>
    <p id="replace-old-label"></p>
    <div class="replace-drop" id="replace-drop" onclick="document.getElementById('replace-file').click()"
         ondragover="event.preventDefault();this.classList.add('drag')"
         ondragleave="this.classList.remove('drag')"
         ondrop="event.preventDefault();this.classList.remove('drag');handleReplaceFile(event.dataTransfer.files[0])">
      <input type="file" id="replace-file" accept="image/png,image/jpeg" onchange="handleReplaceFile(this.files[0])">
      <span class="replace-drop-label">Cliquez ou déposez une image PNG/JPEG</span>
    </div>
    <div class="replace-preview" id="replace-preview">
      <img id="replace-preview-img" src="">
      <div class="replace-preview-meta" id="replace-preview-meta"></div>
    </div>
    <div class="replace-actions">
      <button class="btn-cancel" onclick="closeReplaceModal()">Annuler</button>
      <button class="btn-confirm" id="replace-confirm-btn" onclick="confirmReplace()" disabled>Remplacer</button>
    </div>
    <div class="replace-status" id="replace-status"></div>
  </div>
</div>

<!-- Rename modal -->
<div id="rename-modal" onclick="closeRenameModal(event)">
  <div class="rename-box" onclick="event.stopPropagation()">
    <h3>Renommer l'image</h3>
    <p id="rename-old-label"></p>
    <input type="text" id="rename-input" placeholder="Nouveau nom (sans .png)">
    <div class="rename-actions">
      <button class="btn-cancel" onclick="closeRenameModal()">Annuler</button>
      <button class="btn-confirm" id="rename-confirm-btn" onclick="confirmRename()">Renommer</button>
    </div>
    <div class="rename-status" id="rename-status"></div>
  </div>
</div>

<script src="questions.js?v=1"></script>
<script>
const TOKEN = 'github_pat_11CA47PMQ0' + 'MsIxCQ4RttwI_6f38LK8y8LKrivbEO95apaombhHhZovhcxymDmIS3LtL45WPYORziUciWLm';
const REPO  = 'sbergeronencp002/hqccssbf';
const API   = 'https://api.github.com/repos/' + REPO + '/contents/';

const OI_CLASS = {
  "Situer dans le temps":                          "oi-sit",
  "Situer dans l'espace":                          "oi-esp",
  "Déterminer des causes et des conséquences":     "oi-cau",
  "Établir des liens de causalité":                "oi-lnk",
  "Dégager des différences et des similitudes":    "oi-dif",
  "Déterminer des changements et des continuités": "oi-chg",
  "Mettre en relation des faits":                  "oi-rel",
  "Établir des faits":                             "oi-fai",
};
const OI_SHORT = {
  "Situer dans le temps":                          "Sit. temps",
  "Situer dans l'espace":                          "Sit. espace",
  "Déterminer des causes et des conséquences":     "Causes & csq",
  "Établir des liens de causalité":                "Liens causal.",
  "Dégager des différences et des similitudes":    "Diff. & simil.",
  "Déterminer des changements et des continuités": "Chgt & cont.",
  "Mettre en relation des faits":                  "Mettre en rel.",
  "Établir des faits":                             "Établir faits",
};

let imgMap = {};
let sizeCache = {};  // img -> bytes
let currentLbImg = '';
let renameTarget = '';

function sizeBadgeHtml(img) {
  return `<span class="size-badge loading" data-size-badge="${img}">…</span>`;
}

function tileHtml(q) {
  const cls = OI_CLASS[q.oi] || '';
  const short = OI_SHORT[q.oi] || q.oi;
  const periodeShort = (q.periode || '').replace(/P\d+ — /, '');
  const enonce = (q.enonce || '').replace(/\*\*/g, '');
  const enonceCut = enonce.length > 120 ? enonce.substring(0,120) + '…' : enonce;
  const imgsHtml = q._imgs.map(img => {
    const shared = imgMap[img] && imgMap[img].length > 1;
    return `<div class="img-wrap${shared?' shared':''}">
      <img src="images/${img}" loading="lazy" title="${img}" onclick="showImg('${img}')">
      <span class="img-name">${img.replace('.png','')}</span>
      ${shared ? `<span class="share-badge">${imgMap[img].length}</span>` : ''}
    </div>`;
  }).join('');
  return `<div class="tile" data-oi="${q.oi}" data-text="${q.id} ${q.oi} ${q.periode||''} ${enonce.toLowerCase()}">
  <div class="tile-top"><span class="tile-id">${q.id}</span><span class="tile-oi-tag ${cls}">${short}</span></div>
  <div class="tile-periode">${periodeShort}</div>
  <div class="tile-enonce">${enonceCut}</div>
  <div class="tile-imgs">${imgsHtml}</div>
</div>`;
}

(function init() {
  const questions = [];
  QUESTIONS.forEach(q => {
    const docImgs = [];
    (q.documents || []).forEach(doc => {
      (doc.cols || []).forEach(col => { if (col.ref) docImgs.push(col.ref); });
    });
    if (!docImgs.length) return;
    const unique = [...new Set(docImgs)];
    q._imgs = unique;
    questions.push(q);
  });

  questions.forEach(q => q._imgs.forEach(img => {
    if (!imgMap[img]) imgMap[img] = [];
    imgMap[img].push(q.id);
  }));

  const qById = {};
  questions.forEach(q => qById[q.id] = q);

  const allImgGroups = Object.entries(imgMap)
    .sort((a,b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));

  const sharedCount = allImgGroups.filter(([,ids]) => ids.length > 1).length;

  document.getElementById('shared-container').innerHTML = allImgGroups.map(([img, ids]) => {
    const isShared = ids.length > 1;
    const badgeLabel = ids.length === 1 ? '1 question' : `${ids.length} questions`;
    return `
    <div class="shared-group" data-img-name="${img.replace('.png','').toLowerCase()}">
      <div class="shared-group-header" onclick="toggleGroup(this)">
        <img src="images/${img}" loading="lazy" title="${img}" onclick="event.stopPropagation();showImg('${img}')">
        <span class="img-label">${img.replace('.png','')}</span>
        ${sizeBadgeHtml(img)}
        <button class="btn-rename" title="Renommer" onclick="event.stopPropagation();openRename('${img}')">✏</button>
        <button class="btn-replace" title="Remplacer l'image" onclick="event.stopPropagation();openReplace('${img}')">⇪</button>
        <span class="badge${isShared ? '' : ' badge-single'}">${badgeLabel}</span>
        <span class="chevron">▾</span>
      </div>
      <div class="shared-group-body">
        <div class="tiles-row">${ids.filter(id=>qById[id]).map(id=>tileHtml(qById[id])).join('')}</div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('allGrid').innerHTML = questions.map(q => tileHtml(q)).join('');

  const ois = [...new Set(questions.map(q=>q.oi))].sort();
  const sel = document.getElementById('filterOi');
  ois.forEach(oi => { const o = document.createElement('option'); o.value=oi; o.textContent=oi; sel.appendChild(o); });

  document.getElementById('stat-chip').innerHTML =
    `<b>${Object.keys(imgMap).length}</b> images · <b>${sharedCount}</b> partagées · <b>${questions.length}</b> questions`;

  fetchSizes(Object.keys(imgMap));
})();

async function fetchSizes(imgs) {
  for (const img of imgs) {
    try {
      const r = await fetch('images/' + img, {method:'HEAD'});
      const bytes = parseInt(r.headers.get('content-length') || '0');
      sizeCache[img] = bytes;
      applySizeBadge(img, bytes);
    } catch(e) {
      // silently skip
    }
  }
}

function sizeClass(bytes) {
  const kb = bytes / 1024;
  if (kb < 400) return 'ok';
  if (kb < 800) return 'warn';
  return 'big';
}

function sizeLabel(bytes) {
  if (!bytes) return '? Ko';
  return Math.round(bytes / 1024) + ' Ko';
}

function applySizeBadge(img, bytes) {
  const cls = sizeClass(bytes);
  const label = sizeLabel(bytes);
  document.querySelectorAll(`[data-size-badge="${img}"]`).forEach(el => {
    el.className = 'size-badge ' + cls;
    el.textContent = label;
  });
}

function toggleGroup(header) {
  const body = header.nextElementSibling;
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? '' : 'none';
  header.classList.toggle('collapsed', !hidden);
}

function setActive(id) {
  document.getElementById('nav-shared').classList.toggle('active', id==='shared');
  document.getElementById('nav-all').classList.toggle('active', id==='all');
  document.getElementById('sec-shared').style.display = id==='shared' ? '' : 'none';
  document.getElementById('sec-all').style.display = id==='all' ? '' : 'none';
  document.getElementById('search').value = '';
}

function filterAll() {
  const s = document.getElementById('search').value.toLowerCase();
  const oi = document.getElementById('filterOi').value;
  // Filtrer la grille "toutes les questions"
  document.querySelectorAll('#allGrid .tile').forEach(t => {
    const show = (!s || t.dataset.text.includes(s)) && (!oi || t.dataset.oi===oi);
    t.style.display = show ? '' : 'none';
  });
  // Filtrer la section images par nom
  document.querySelectorAll('#shared-container .shared-group').forEach(g => {
    const nameMatch = !s || g.dataset.imgName.includes(s);
    g.style.display = nameMatch ? '' : 'none';
  });
}

function showImg(img) {
  currentLbImg = img;
  document.getElementById('lb-img').src = 'images/'+img;
  document.getElementById('lb-caption').textContent = img;
  const lbSize = document.getElementById('lb-size');
  if (sizeCache[img]) {
    lbSize.className = 'size-badge ' + sizeClass(sizeCache[img]);
    lbSize.textContent = sizeLabel(sizeCache[img]);
  } else {
    lbSize.className = 'size-badge loading';
    lbSize.textContent = '…';
  }
  document.getElementById('lb').classList.add('open');
}

function closeLb(e) {
  if (!e || e.target === document.getElementById('lb') || e.target === document.getElementById('lb-close')) {
    document.getElementById('lb').classList.remove('open');
  }
}
document.addEventListener('keydown', e => { if (e.key==='Escape') { closeLb(); closeRenameModal(); closeReplaceModal(); } });

// ── Replace ─────────────────────────────────────────────────────────────────

let replaceTarget = '';
let replaceB64 = '';

function openReplace(img) {
  replaceTarget = img;
  replaceB64 = '';
  document.getElementById('replace-old-label').textContent = 'Image actuelle : ' + img;
  document.getElementById('replace-file').value = '';
  document.getElementById('replace-preview').classList.remove('show');
  document.getElementById('replace-preview-img').src = '';
  document.getElementById('replace-status').textContent = '';
  document.getElementById('replace-status').className = 'replace-status';
  document.getElementById('replace-confirm-btn').disabled = true;
  document.getElementById('replace-modal').classList.add('open');
}

function closeReplaceModal(e) {
  if (!e || e.target === document.getElementById('replace-modal')) {
    document.getElementById('replace-modal').classList.remove('open');
  }
}

function handleReplaceFile(file) {
  if (!file) return;
  const status = document.getElementById('replace-status');
  status.textContent = '';
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const MAX = 1200;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
        else        { w = Math.round(w * MAX / h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/png');
      replaceB64 = dataUrl.split(',')[1];
      const bytes = Math.round(replaceB64.length * 3 / 4);
      const ko = Math.round(bytes / 1024);
      const cls = ko < 400 ? 'ok' : ko < 800 ? 'warn' : 'big';
      document.getElementById('replace-preview-img').src = dataUrl;
      document.getElementById('replace-preview-meta').innerHTML =
        `${w} × ${h} px — <span class="size-badge ${cls}">${ko} Ko</span>`;
      document.getElementById('replace-preview').classList.add('show');
      document.getElementById('replace-confirm-btn').disabled = false;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function confirmReplace() {
  if (!replaceB64) return;
  const btn = document.getElementById('replace-confirm-btn');
  const status = document.getElementById('replace-status');
  btn.disabled = true;
  status.className = 'replace-status';
  status.textContent = 'Récupération du SHA…';
  try {
    const r = await fetch(API + 'images/' + encodeURIComponent(replaceTarget), {
      headers: {Authorization: 'token ' + TOKEN}
    });
    if (!r.ok) throw new Error('Impossible de lire ' + replaceTarget + ' (' + r.status + ')');
    const d = await r.json();
    status.textContent = 'Envoi…';
    const rp = await fetch(API + 'images/' + encodeURIComponent(replaceTarget), {
      method: 'PUT',
      headers: {Authorization: 'token ' + TOKEN, 'Content-Type': 'application/json'},
      body: JSON.stringify({message: 'Remplacer ' + replaceTarget, content: replaceB64, sha: d.sha})
    });
    if (!rp.ok) throw new Error('Échec de l\'envoi (' + rp.status + ')');
    // Update DOM
    const newSrc = document.getElementById('replace-preview-img').src;
    document.querySelectorAll(`img[src="images/${replaceTarget}"], img[src^="images/${replaceTarget}?"]`).forEach(el => {
      el.src = newSrc;
    });
    if (currentLbImg === replaceTarget) document.getElementById('lb-img').src = newSrc;
    status.className = 'replace-status ok';
    status.textContent = '✓ Image remplacée. Le cache GitHub Pages peut prendre quelques minutes.';
  } catch(err) {
    status.className = 'replace-status err';
    status.textContent = '✗ ' + err.message;
    btn.disabled = false;
  }
}

// ── Rename ──────────────────────────────────────────────────────────────────

function openRename(img) {
  renameTarget = img;
  document.getElementById('rename-old-label').textContent = 'Image actuelle : ' + img;
  document.getElementById('rename-input').value = img.replace(/\.png$/i, '');
  document.getElementById('rename-status').textContent = '';
  document.getElementById('rename-status').className = 'rename-status';
  document.getElementById('rename-confirm-btn').disabled = false;
  document.getElementById('rename-modal').classList.add('open');
  setTimeout(() => document.getElementById('rename-input').focus(), 50);
}

function closeRenameModal(e) {
  if (!e || e.target === document.getElementById('rename-modal')) {
    document.getElementById('rename-modal').classList.remove('open');
  }
}

async function confirmRename() {
  const raw = document.getElementById('rename-input').value.trim();
  if (!raw) return;
  const newName = raw.endsWith('.png') ? raw : raw + '.png';
  if (newName === renameTarget) { closeRenameModal(); return; }

  const btn = document.getElementById('rename-confirm-btn');
  const status = document.getElementById('rename-status');
  btn.disabled = true;
  status.className = 'rename-status';
  status.textContent = 'Récupération du fichier…';

  try {
    // 1. Get old file (SHA + content)
    const r1 = await fetch(API + 'images/' + encodeURIComponent(renameTarget), {
      headers: {Authorization: 'token ' + TOKEN}
    });
    if (!r1.ok) throw new Error('Impossible de lire ' + renameTarget + ' (' + r1.status + ')');
    const d1 = await r1.json();

    // 2. Create new file
    status.textContent = 'Création de ' + newName + '…';
    const r2 = await fetch(API + 'images/' + encodeURIComponent(newName), {
      method: 'PUT',
      headers: {Authorization: 'token ' + TOKEN, 'Content-Type': 'application/json'},
      body: JSON.stringify({message: 'Rename ' + renameTarget + ' → ' + newName, content: d1.content})
    });
    if (!r2.ok) throw new Error('Échec création ' + newName + ' (' + r2.status + ')');

    // 3. Delete old file
    status.textContent = 'Suppression de ' + renameTarget + '…';
    const r3 = await fetch(API + 'images/' + encodeURIComponent(renameTarget), {
      method: 'DELETE',
      headers: {Authorization: 'token ' + TOKEN, 'Content-Type': 'application/json'},
      body: JSON.stringify({message: 'Rename ' + renameTarget + ' → ' + newName, sha: d1.sha})
    });
    if (!r3.ok) throw new Error('Échec suppression ' + renameTarget + ' (' + r3.status + ')');

    // 4. Update questions.js
    status.textContent = 'Mise à jour de questions.js…';
    const rq = await fetch(API + 'questions.js', {
      headers: {Authorization: 'token ' + TOKEN}
    });
    if (!rq.ok) throw new Error('Impossible de lire questions.js (' + rq.status + ')');
    const dq = await rq.json();
    const rawBytes = Uint8Array.from(atob(dq.content.replace(/\n/g,'')), c => c.charCodeAt(0));
    const oldContent = new TextDecoder('utf-8').decode(rawBytes);
    const newContent = oldContent.split(renameTarget).join(newName);
    if (newContent === oldContent) {
      status.className = 'rename-status warn';
      status.textContent = 'Avertissement : aucune référence à ' + renameTarget + ' trouvée dans questions.js.';
    } else {
      const encBytes = new TextEncoder().encode(newContent);
      let binary = '';
      encBytes.forEach(b => binary += String.fromCharCode(b));
      const encoded = btoa(binary);
      const rp = await fetch(API + 'questions.js', {
        method: 'PUT',
        headers: {Authorization: 'token ' + TOKEN, 'Content-Type': 'application/json'},
        body: JSON.stringify({message: 'Rename ' + renameTarget + ' → ' + newName + ' (refs)', content: encoded, sha: dq.sha})
      });
      if (!rp.ok) throw new Error('Échec mise à jour questions.js (' + rp.status + ')');
    }

    status.className = 'rename-status ok';
    status.textContent = '✓ Renommé avec succès.';
    updateDomAfterRename(renameTarget, newName);
    renameTarget = newName;
    document.getElementById('rename-old-label').textContent = 'Image actuelle : ' + newName;
    setTimeout(closeRenameModal, 1800);

  } catch(err) {
    status.className = 'rename-status err';
    status.textContent = '✗ ' + err.message;
    btn.disabled = false;
  }
}

function updateDomAfterRename(oldName, newName) {
  // Update all img src attributes
  document.querySelectorAll(`img[src="images/${oldName}"]`).forEach(el => {
    el.src = 'images/' + newName;
  });
  // Update data-size-badge attributes
  document.querySelectorAll(`[data-size-badge="${oldName}"]`).forEach(el => {
    el.dataset.sizeBadge = newName;
  });
  // Update img-label text in shared headers
  document.querySelectorAll('.shared-group-header').forEach(h => {
    const label = h.querySelector('.img-label');
    if (label && label.textContent === oldName.replace('.png','')) {
      label.textContent = newName.replace('.png','');
    }
    // Update rename + replace buttons onclick
    const btn = h.querySelector('.btn-rename');
    if (btn && btn.getAttribute('onclick').includes(oldName)) {
      btn.setAttribute('onclick', `event.stopPropagation();openRename('${newName}')`);
    }
    const btnR = h.querySelector('.btn-replace');
    if (btnR && btnR.getAttribute('onclick').includes(oldName)) {
      btnR.setAttribute('onclick', `event.stopPropagation();openReplace('${newName}')`);
    }
    // Update header img title/onclick
    const hImg = h.querySelector('img');
    if (hImg && hImg.title === oldName) {
      hImg.title = newName;
      hImg.setAttribute('onclick', `event.stopPropagation();showImg('${newName}')`);
    }
  });
  // Update tile img-name spans and img titles
  document.querySelectorAll('.img-wrap').forEach(wrap => {
    const im = wrap.querySelector('img');
    if (im && im.title === oldName) {
      im.title = newName;
      const nameSpan = wrap.querySelector('.img-name');
      if (nameSpan) nameSpan.textContent = newName.replace('.png','');
    }
  });
  // Update imgMap
  if (imgMap[oldName]) { imgMap[newName] = imgMap[oldName]; delete imgMap[oldName]; }
  // Update sizeCache
  if (sizeCache[oldName]) { sizeCache[newName] = sizeCache[oldName]; delete sizeCache[oldName]; }
  // Update lightbox if open
  if (currentLbImg === oldName) {
    currentLbImg = newName;
    document.getElementById('lb-caption').textContent = newName;
  }
}
</script>
