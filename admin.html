// désormais définis dans questions-io.js (partagé avec documents.html).

// ── VALIDATION ────────────────────────────────────────────────────────
function validateForm() {
  const errors = [];
  if(!document.getElementById('q-id').value.trim()) errors.push('ID manquant');
  if(!document.getElementById('q-enonce').value.trim()) errors.push('Énoncé vide');
  if(!document.getElementById('q-periode').value) errors.push('Période non sélectionnée');
  if(!document.querySelectorAll('#aspects-list input[type=checkbox]:checked').length) errors.push('Aucun aspect sélectionné');
  const repType = document.getElementById('rep-type').value;
  if(repType === 'image' && !document.getElementById('rep-ref')?.value) errors.push('Image de réponse non sélectionnée');
  if(repType === 'tableau_3col' && !document.getElementById('rep-col2')?.value.trim()) errors.push('Étiquette centrale du tableau manquante');
  if(repType === 'tableau' && !document.getElementById('rep-lignes')?.value.trim()) errors.push('Lignes du tableau réponse vides');
  const oi = document.getElementById('q-oi').value;
  if((REGLETTES_PRESET[oi] || []).length > 0 && document.getElementById('reg-preset').value === '') errors.push('Réglette non sélectionnée');
  return errors;
}

// Rétention des backups : conserve les plus récents, supprime les plus anciens.
// Best-effort, fire-and-forget, plafonné pour éviter les rafales d'appels API.
// (Le contenu supprimé reste récupérable dans l'historique git.)
async function pruneBackups(token) {
  const KEEP = 20;        // backups conservés
  const MAX_DEL = 12;     // suppressions max par publication
  try {
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/backups?ref=${BRANCH}&t=${Date.now()}`,
      { headers: { Authorization: `token ${token}` }, cache: 'no-store' });
    if(!r.ok) return;
    const files = (await r.json())
      .filter(f => f.type === 'file' && /^questions-.*\.js$/.test(f.name))
      .sort((a,b) => a.name.localeCompare(b.name));   // noms ISO → ordre chronologique
    const excess = files.length - KEEP;
    if(excess <= 0) return;
    for(const f of files.slice(0, Math.min(excess, MAX_DEL))) {
      await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/backups/${encodeURIComponent(f.name)}`, {
        method: 'DELETE',
        headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: `Élaguer backup ${f.name}`, sha: f.sha, branch: BRANCH })
      }).catch(()=>{});
    }
  } catch(_) {}
}

// ── PUBLIER ───────────────────────────────────────────────────────────
async function publier() {
  const token = getToken();
  if(!token) { toast('Saisis ton token GitHub.', 'err'); return; }
  const errors = validateForm();
  if(errors.length) { toast('Champs manquants : ' + errors.join(', '), 'err'); return; }

  const btn = document.getElementById('btn-publier');
  const status = document.getElementById('publish-status');
  btn.disabled = true;
  btn.textContent = '⏳ Publication…';
  status.textContent = '';

  try {
    // Backup automatique (fire-and-forget) depuis l'état local — pas besoin de re-télécharger.
    // fetchFreshState() est appelé automatiquement par la boucle de retry si le SHA est périmé (409).
    const ts = new Date().toISOString().slice(0,19).replace('T','_').replace(/:/g,'-');
    const backupB64 = utf8b64(generateQuestionsJs(currentQuestions, currentReglettes, currentImageDb));
    fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/backups/questions-${ts}.js`, {
      method:'PUT',
      headers:{ Authorization:`token ${token}`, 'Content-Type':'application/json' },
      body: JSON.stringify({ message:`Backup auto ${ts}`, content: backupB64, branch: BRANCH })
    }).then(() => pruneBackups(token)).catch(()=>{});

    const q = buildQuestion();
    const r = buildReglette(q.id);

    if(!editingId && currentQuestions.find(x => x.id === q.id)) {
      toast(`L'identifiant ${q.id} existe déjà — rechargez (F5) pour obtenir le prochain ID libre.`, 'err');
      btn.disabled = false; btn.textContent = 'Publier sur GitHub';
      return;
    }

    // Warnings avant publication
    const pubWarnings = [];
    if(!q.guide) pubWarnings.push('• Cette question n\'a pas de guide de correction.');
    if(pubWarnings.length && !confirm('⚠️ Avertissements avant publication :\n\n' + pubWarnings.join('\n') + '\n\nPublier quand même ?')) {
      btn.disabled = false; btn.textContent = 'Publier sur GitHub'; return;
    }

    // Add image to IMAGE_DB if not present
    const refsUsed = new Set();
    q.documents.forEach(d => d.cols?.forEach(c => { if(c.ref) refsUsed.add(c.ref); }));
    if(q.reponse?.ref) refsUsed.add(q.reponse.ref);
    refsUsed.forEach(ref => {
      if(!currentImageDb[ref]) currentImageDb[ref] = { src: 'images/' + ref };
    });

    if(editingId) {
      const idx = currentQuestions.findIndex(x => x.id === editingId);
      if(idx !== -1) currentQuestions[idx] = q; else currentQuestions.push(q);
    } else {
      currentQuestions.push(q);
    }
    currentReglettes[q.id] = r;

    const commitMsg = editingId ? `Modifier ${q.id} — ${q.oi}` : `Ajouter ${q.id} — ${q.oi} (${q.periode})`;

    // PUT avec retry automatique sur conflit SHA (jusqu'à 3 tentatives)
    let putResp, putResult;
    for(let attempt = 0; attempt < 3; attempt++) {
      if(attempt > 0) {
        // Rafraîchir le SHA avant de réessayer
        await fetchFreshState(token);
        // Reconstruire le contenu avec les questions à jour (évite d'écraser des publications concurrentes)
        if(editingId) {
          const idx2 = currentQuestions.findIndex(x => x.id === editingId);
          if(idx2 !== -1) currentQuestions[idx2] = q; else currentQuestions.push(q);
        } else if(!currentQuestions.find(x => x.id === q.id)) {
          currentQuestions.push(q);
        } else {
          throw new Error(`L'identifiant ${q.id} a été ajouté par un autre utilisateur entre-temps. Rechargez la page (F5).`);
        }
        currentReglettes[q.id] = r;
        // Re-apply IMAGE_DB entries (fetchFreshState reset currentImageDb)
        refsUsed.forEach(ref => {
          if(!currentImageDb[ref]) currentImageDb[ref] = { src: 'images/' + ref };
        });
      }
      const newContent2 = generateQuestionsJs(currentQuestions, currentReglettes, currentImageDb);
      const encoded2 = utf8b64(newContent2);
      putResp = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/questions.js`, {
        method: 'PUT',
        headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: commitMsg, content: encoded2, sha: questionsFileSha, branch: BRANCH })
      });
      if(putResp.ok) { putResult = await putResp.json(); break; }
      let msg = putResp.status;
      try { const err = await putResp.json(); msg = err.message || msg; } catch(_) {}
      const isConflict = putResp.status === 409 || String(msg).toLowerCase().includes('fast forward') || String(msg).toLowerCase().includes('conflict');
      if(!isConflict || attempt === 2) throw new Error(isConflict ? 'Conflit persistant après 3 tentatives. Rechargez la page (F5) et réessayez.' : msg);
      await new Promise(r => setTimeout(r, 800 * (attempt + 1)));
    }

    // Update SHA
    questionsFileSha = putResult.content.sha;

    // Next ID
    const nums = currentQuestions.map(q=>parseInt(q.id.replace(/\D/g,''))).filter(n=>!isNaN(n));
    const nextId = 'Q' + (nums.length ? Math.max(...nums)+1 : 1);
    document.getElementById('q-id').value = nextId;
    document.getElementById('next-id-badge').textContent = nextId;

    toast(editingId ? `${q.id} modifié !` : `${q.id} publié !`, 'ok');
    renderDashboard();
    const statusMsg = `✓ ${q.id} ${editingId?'modifié':'ajouté'}`;
    let secs = 30;
    const cd = setInterval(() => {
      status.textContent = secs > 0 ? `${statusMsg} — visible dans ${secs}s` : `${statusMsg} — visible maintenant`;
      if(secs-- <= 0) clearInterval(cd);
    }, 1000);
    editingId = null;
    resetForm(true);

  } catch(e) {
    toast('Erreur : ' + e.message, 'err');
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Publier sur GitHub';
  }
}

// ── RESET ─────────────────────────────────────────────────────────────
function resetForm(keepId=false) {
  editingId = null;
  formDirty = false;
  const newRadio = document.querySelector('input[name="mode"][value="new"]');
  if(newRadio) { newRadio.checked = true; document.getElementById('edit-select-wrap').style.display='none'; }
  if(!keepId) document.getElementById('q-id').value = '';
  document.getElementById('q-niveau').value = '3';
  document.getElementById('q-oi').value = document.getElementById('q-oi').options[0].value;
  updatePresets();
  updateSoustag();
  setSoustag('');
  document.getElementById('q-periode').value = document.getElementById('q-periode').options[0].value;
  document.getElementById('q-enonce').value = '';
  updatePeriodes();
  document.getElementById('docs-list').innerHTML = '';
  document.getElementById('rep-type').value = 'none';
  document.getElementById('rep-extra').innerHTML = '';
  document.getElementById('reg-preset').value = '';
  document.getElementById('guide-type').value = 'grille';
  docCount = 0; colCount = 0;
  updateGuideUI();
}

// ── TABLEAU DE BORD ───────────────────────────────────────────────────
function toggleDashboard() {
  const content = document.getElementById('dashboard-content');
  const icon = document.getElementById('dashboard-toggle-icon');
  const hidden = content.style.display === 'none';
  content.style.display = hidden ? '' : 'none';
  icon.textContent = hidden ? '▲' : '▼';
}

function renderDashboard() {
  if(!currentQuestions.length) return;
  document.getElementById('dashboard-section').style.display = '';
  // Garde l'état masqué/visible existant (pas de forçage)

  const totalQ   = currentQuestions.length;
  const totalPts = currentQuestions.reduce((s,q) => s + (q.points||0), 0);
  document.getElementById('dashboard-total').textContent = `${totalQ} question${totalQ>1?'s':''} · ${totalPts} pts`;

  // Périodes par niveau
  const niveaux = [
    { label: 'Niveau 3', num: '3', color: '#1B3B6F' },
    { label: 'Niveau 4', num: '4', color: '#6B3FA0' }
  ];
  const periodes = Object.keys(ASPECTS_PAR_PERIODE || {});
  const n3 = periodes.slice(0,4);
  const n4 = periodes.slice(4,8);

  // Répartition par OI pour une période donnée (dépliée au clic), triée par nombre
  function periodeDetailHtml(periode, color) {
    const inP = currentQuestions.filter(x => x.periode === periode);
    if(!inP.length) {
      return '<div class="dash-period-detail" style="display:none"><div class="dash-sub-row"><span class="dash-sub-label" style="font-style:italic;color:var(--ink-3)">Aucune question</span></div></div>';
    }
    const m = {};
    inP.forEach(q => { if(!m[q.oi]) m[q.oi] = { q:0, pts:0 }; m[q.oi].q++; m[q.oi].pts += q.points||0; });
    const totalInP = inP.length;
    const rows = Object.entries(m)
      .sort((a,b) => b[1].q - a[1].q || a[0].localeCompare(b[0], 'fr'))
      .map(([oi,v]) => {
        const pct = Math.round(v.q / totalInP * 100);
        return `<div class="dash-sub-row"><span class="dash-sub-label" title="${escHtml(oi)}">${escHtml(oi)}</span><div class="dash-sub-bar-wrap"><div class="dash-sub-bar" style="width:${pct}%;background:${color}"></div></div><span class="dash-sub-count">${pct}% · ${v.q}q · ${v.pts}pts</span></div>`;
      })
      .join('');
    const nOi = Object.keys(m).length;
    const head = `<div class="dash-sub-row" style="margin-bottom:.3rem"><span class="dash-sub-label" style="font-weight:600;color:var(--ink-3)">${nOi} OI</span></div>`;
    return `<div class="dash-period-detail" style="display:none">${head}${rows}</div>`;
  }

  function barRows(list, color) {
    const counts = list.map(p => ({
      p,
      q: currentQuestions.filter(x => x.periode === p).length,
      pts: currentQuestions.filter(x => x.periode === p).reduce((s,x) => s+(x.points||0), 0)
    }));
    // Barre = part de la période dans le total du niveau (la piste = 100 % du programme)
    const levelTotalQ = counts.reduce((s,c) => s+c.q, 0) || 1;
    return counts.map(c => {
      const pct = Math.round(c.q / levelTotalQ * 100);
      const shortLabel = c.p.replace(/^P\d+ — /, '');
      return `<div class="dash-period-block">
        <div class="dash-row dash-row-clickable" role="button" tabindex="0" title="Voir la répartition par OI"
          onclick="togglePeriode(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togglePeriode(this)}">
          <div class="dash-label" title="${escHtml(c.p)}">${escHtml(c.p.match(/^P\d+/)?.[0]||'')} — ${escHtml(shortLabel.slice(0,22))}${shortLabel.length>22?'…':''}</div>
          <div class="dash-bar-wrap" title="${pct}% du niveau (${c.q} / ${levelTotalQ} questions)"><div class="dash-bar" style="width:${pct}%;background:${color}${c.q===0?';opacity:.25':''}"></div></div>
          <div class="dash-count">${pct}% · ${c.q}q · ${c.pts}pts</div>
          <span class="dash-chevron">▾</span>
        </div>
        ${periodeDetailHtml(c.p, color)}
      </div>`;
    }).join('');
  }

  // OI distribution
  const oiMap = {};
  currentQuestions.forEach(q => {
    if(!oiMap[q.oi]) oiMap[q.oi] = { q:0, pts:0 };
    oiMap[q.oi].q++;
    oiMap[q.oi].pts += q.points||0;
  });
  const oiList = Object.entries(oiMap).sort((a,b) => a[0].localeCompare(b[0], 'fr'));
  const maxOiQ = Math.max(...oiList.map(e => e[1].q), 1);
  const oiRows = oiList.map(([oi, val]) => {
    const pct = Math.round(val.q / maxOiQ * 100);
    return `<div class="dash-oi-row">
      <div class="dash-oi-label" title="${escHtml(oi)}">${escHtml(oi)}</div>
      <div class="dash-bar-wrap" style="max-width:120px"><div class="dash-bar" style="width:${pct}%;background:#888"></div></div>
      <div class="dash-oi-count">${val.q}q · ${val.pts}pts</div>
    </div>`;
  }).join('');

  const n3Total = currentQuestions.filter(q=>String(q.niveau)==='3');
  const n4Total = currentQuestions.filter(q=>String(q.niveau)==='4');

  document.getElementById('dashboard-content').innerHTML = `
    <div class="dash-grid">
      <div class="dash-col" id="dash-col-n3">
        <button class="dash-n4-toggle" onclick="toggleN3(this)">▼ Niveau 3 — ${n3Total.length}q · ${n3Total.reduce((s,q)=>s+(q.points||0),0)}pts</button>
        <div id="dash-n3-content">
          ${barRows(n3, '#1B3B6F')}
        </div>
      </div>
      <div class="dash-col collapsed" id="dash-col-n4">
        <button class="dash-n4-toggle" onclick="toggleN4(this)">▶ Niveau 4 — ${n4Total.length}q · ${n4Total.reduce((s,q)=>s+(q.points||0),0)}pts</button>
        <div id="dash-n4-content" style="display:none">
          ${barRows(n4, '#6B3FA0')}
        </div>
      </div>
    </div>
    <hr class="dash-divider">
    <div class="dash-niv-title">Par opération intellectuelle</div>
    ${oiRows}
  `;
}

function toggleN3(btn) {
  const content = document.getElementById('dash-n3-content');
  const col = document.getElementById('dash-col-n3');
  const hidden = content.style.display === 'none';
  content.style.display = hidden ? '' : 'none';
  col.classList.toggle('collapsed', !hidden);
  btn.textContent = (hidden ? '▼ ' : '▶ ') + btn.textContent.slice(2);
}
function toggleN4(btn) {
  const content = document.getElementById('dash-n4-content');
  const col = document.getElementById('dash-col-n4');
  const hidden = content.style.display === 'none';
  content.style.display = hidden ? '' : 'none';
  col.classList.toggle('collapsed', !hidden);
  btn.textContent = (hidden ? '▼ ' : '▶ ') + btn.textContent.slice(2);
}

// Déplie/replie la répartition par OI sous une période du tableau de bord
function togglePeriode(rowEl) {
  const detail = rowEl.nextElementSibling;
  if(!detail || !detail.classList.contains('dash-period-detail')) return;
  const hidden = detail.style.display === 'none';
  detail.style.display = hidden ? '' : 'none';
  rowEl.classList.toggle('open', hidden);
}

// ── TOAST ─────────────────────────────────────────────────────────────
function toast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = type;
  el.style.display = 'block';
  setTimeout(()=>{ el.style.display='none'; }, 3500);
}
</script>
