<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — HQC · CSSBF</title>
<script src="reglettes.js"></script>
<script src="contexte.js"></script>
<style>
:root {
  --ink: #1a1814; --ink-2: #4a4740; --ink-3: #8a8680;
  --paper: #f7f4ef; --paper-2: #ede9e2; --paper-3: #e2ddd5;
  --accent: #1B3B6F; --border: rgba(26,24,20,0.15);
  --green: #1a5c3a; --red: #c0392b;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans','Segoe UI',Helvetica,Arial,sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }

/* ── HEADER ── */
header { background: var(--accent); color: #fff; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 1.2rem; font-weight: 500; }
header a { color: rgba(255,255,255,.7); font-size: .8rem; text-decoration: none; }
header a:hover { color: #fff; }

/* ── LAYOUT ── */
#app { display: flex; flex-direction: column; min-height: 100vh; }
.container { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem; }

/* ── TOKEN BAR ── */
.token-bar { background: var(--paper-2); border: 1px solid var(--border); border-radius: 7px; padding: .75rem 1rem; display: flex; gap: .75rem; align-items: center; margin-bottom: 2rem; }
.token-bar label { font-size: .75rem; font-weight: 600; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.token-bar input { flex: 1; padding: .4rem .6rem; border: 1px solid var(--border); border-radius: 4px; font-size: .8rem; font-family: monospace; }
.token-status { font-size: .75rem; white-space: nowrap; }
.token-status.ok { color: var(--green); }
.token-status.ko { color: var(--red); }

/* ── SECTION ── */
.section { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
.section-title { font-size: .65rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-bottom: 1rem; }

/* ── FORM ── */
.field { margin-bottom: 1rem; }
.field label { display: block; font-size: .75rem; font-weight: 600; color: var(--ink-2); margin-bottom: .35rem; }
.field input, .field select, .field textarea {
  width: 100%; padding: .5rem .75rem; border: 1px solid var(--border);
  border-radius: 5px; font-family: inherit; font-size: .85rem; color: var(--ink);
  background: var(--paper); transition: border-color .15s;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 80px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }

/* ── DYNAMIC BLOCKS ── */
.block { border: 1px solid var(--border); border-radius: 6px; padding: 1rem; margin-bottom: .75rem; position: relative; background: var(--paper); }
.block-title { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin-bottom: .75rem; }
.btn-remove { position: absolute; top: .6rem; right: .6rem; background: none; border: none; color: var(--ink-3); font-size: 1.1rem; cursor: pointer; padding: 0 .2rem; line-height: 1; }
.btn-remove:hover { color: var(--red); }
.btn-add { display: inline-flex; align-items: center; gap: .4rem; padding: .4rem .9rem; background: var(--paper-2); border: 1px dashed var(--border); border-radius: 5px; font-size: .78rem; color: var(--ink-2); cursor: pointer; margin-top: .25rem; transition: all .15s; }
.btn-add:hover { background: var(--paper-3); color: var(--ink); border-style: solid; }

/* ── COLS ── */
.col-block { border: 1px solid var(--border); border-radius: 5px; padding: .75rem; margin-bottom: .5rem; background: #fff; position: relative; }
.col-type-toggle { display: flex; gap: .4rem; margin-bottom: .6rem; }
.col-type-toggle button { padding: .25rem .6rem; border: 1px solid var(--border); border-radius: 4px; font-size: .72rem; cursor: pointer; background: var(--paper); color: var(--ink-2); }
.col-type-toggle button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ── NIVEAU CHIPS ── */
.niveau-row { display: flex; align-items: center; gap: .6rem; margin-bottom: .5rem; }
.niveau-row input[type=number] { width: 60px; }
.niveau-row input[type=text] { flex: 1; }
.niveau-row .btn-remove { position: static; }

/* ── ACTIONS ── */
.actions { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-top: 1rem; }
.btn-primary { padding: .65rem 1.5rem; background: var(--green); color: #fff; border: none; border-radius: 6px; font-size: .9rem; font-weight: 600; cursor: pointer; transition: opacity .15s; }
.btn-primary:hover { opacity: .88; }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; }
.btn-secondary { padding: .6rem 1.2rem; background: var(--paper-2); border: 1px solid var(--border); border-radius: 6px; font-size: .85rem; cursor: pointer; }
.btn-secondary:hover { background: var(--paper-3); }
.btn-danger { padding: .6rem 1.2rem; background: var(--red); color: #fff; border: none; border-radius: 6px; font-size: .85rem; cursor: pointer; opacity: .85; }
.btn-danger:hover { opacity: 1; }
.btn-danger:disabled { opacity: .35; cursor: not-allowed; }

/* ── TOAST ── */
#toast { position: fixed; bottom: 1.5rem; right: 1.5rem; padding: .75rem 1.25rem; border-radius: 7px; font-size: .85rem; font-weight: 500; display: none; z-index: 999; color: #fff; }
#toast.ok { background: var(--green); }
#toast.err { background: var(--red); }

/* ── ID badge ── */
.id-badge { display: inline-block; background: var(--accent); color: #fff; font-size: .7rem; font-weight: 700; padding: .15rem .5rem; border-radius: 4px; letter-spacing: .05em; }
</style>
</head>
<body>

<!-- APP -->
<div id="app">
  <header>
    <h1>HQC · CSSBF — Gestion des questions</h1>
    <a href="index.html">← Retour au site</a>
  </header>

  <div class="container">

    <!-- TOKEN -->
    <div class="token-bar">
      <label>Token GitHub</label>
      <input type="password" id="gh-token" placeholder="ghp_..." autocomplete="off" oninput="saveToken()">
      <span class="token-status" id="token-status"></span>
    </div>

    <!-- MODE -->
    <div class="section">
      <div class="section-title">Mode</div>
      <div style="display:flex;gap:1.5rem;margin-bottom:.5rem">
        <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer;font-size:.85rem">
          <input type="radio" name="mode" value="new" checked onchange="setMode('new')"> Nouvelle question
        </label>
        <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer;font-size:.85rem">
          <input type="radio" name="mode" value="edit" onchange="setMode('edit')"> Modifier une question existante
        </label>
      </div>
      <div id="edit-select-wrap" style="display:none">
        <div class="field" style="margin-bottom:.75rem">
          <label>Question à modifier</label>
          <select id="edit-q-select" onchange="loadQuestion(this.value)">
            <option value="">— Choisir —</option>
          </select>
        </div>
        <button class="btn-danger" id="btn-supprimer" onclick="supprimerQuestion()" disabled>🗑 Supprimer cette question</button>
      </div>
    </div>

    <!-- IDENTIFIANT -->
    <div class="section">
      <div class="section-title">Identifiant</div>
      <div class="field">
        <label>ID de la question <span id="next-id-badge" class="id-badge"></span></label>
        <input type="text" id="q-id" placeholder="Chargement…">
      </div>
    </div>

    <!-- CONTEXTE -->
    <div class="section">
      <div class="section-title">Contexte</div>
      <div class="row">
        <div class="field">
          <label>Niveau</label>
          <select id="q-niveau" onchange="updatePeriodes()">
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </div>
        <div class="field">
          <label>Période</label>
          <select id="q-periode" onchange="updateAspects()">
            <option value="P1 — Des origines à 1608">P1 — Des origines à 1608</option>
            <option value="P2 — 1608 – 1760">P2 — 1608 – 1760</option>
            <option value="P3 — 1760 – 1791">P3 — 1760 – 1791</option>
            <option value="P4 — 1791 – 1840">P4 — 1791 – 1840</option>
            <option value="P5 — 1840 – 1896">P5 — 1840 – 1896</option>
            <option value="P6 — 1896 – 1945">P6 — 1896 – 1945</option>
            <option value="P7 — 1945 – 1980">P7 — 1945 – 1980</option>
            <option value="P8 — De 1980 à nos jours">P8 — De 1980 à nos jours</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Aspect(s)</label>
        <div id="aspects-list" style="display:flex;flex-direction:column;gap:.3rem;margin-top:.3rem;padding:.5rem;background:var(--paper);border:1px solid var(--border);border-radius:5px;max-height:180px;overflow-y:auto"></div>
      </div>
      <div class="field">
        <label>Opération intellectuelle</label>
        <select id="q-oi" onchange="updatePresets()">
          <option>Situer dans le temps</option>
          <option>Situer dans l'espace</option>
          <option>Établir des liens de causalité</option>
          <option>Dégager des différences et des similitudes</option>
          <option>Déterminer des changements et des continuités</option>
          <option>Déterminer des causes et des conséquences</option>
          <option>Mettre en relation des faits</option>
        </select>
      </div>
    </div>

    <!-- QUESTION -->
    <div class="section">
      <div class="section-title">Question</div>
      <div class="field">
        <textarea id="q-enonce" rows="4" placeholder="Texte de la question…"></textarea>
      </div>
    </div>

    <!-- DOCUMENTS -->
    <div class="section">
      <div class="section-title">Documents</div>
      <div id="docs-list"></div>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap">
        <button class="btn-add" onclick="addDoc('textes')">+ Texte</button>
        <button class="btn-add" onclick="addDoc('image')">+ Image</button>
        <button class="btn-add" onclick="addDoc('textes-image')">+ Texte + Image (côte à côte)</button>
      </div>
    </div>

    <!-- UPLOAD IMAGE -->
    <div class="section">
      <div class="section-title">Téléverser une image</div>
      <div class="row">
        <div class="field">
          <label>Fichier</label>
          <input type="file" id="upload-file" accept="image/*" onchange="onUploadFileChange()" style="padding:.3rem">
        </div>
        <div class="field">
          <label>Renommer <span style="font-weight:400;color:var(--ink-3)">(optionnel)</span></label>
          <input type="text" id="upload-name" placeholder="nom_du_fichier.png">
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:1rem;margin-top:.5rem">
        <button class="btn-secondary" id="btn-upload" onclick="uploadImage()">⬆ Téléverser dans GitHub</button>
        <span id="upload-status" style="font-size:.82rem;color:var(--ink-3)"></span>
      </div>
    </div>

    <!-- RÉPONSE -->
    <div class="section">
      <div class="section-title">Réponse</div>
      <div class="field">
        <label>Type de réponse</label>
        <select id="rep-type" onchange="updateReponseUI()">
          <option value="none">Aucune</option>
          <option value="lignes">Lignes de réponse</option>
          <option value="image_ligne">Image + ligne</option>
          <option value="tableau">Tableau</option>
        </select>
      </div>
      <div id="rep-extra"></div>
    </div>

    <!-- RÉGLETTE -->
    <div class="section">
      <div class="section-title">Réglette</div>
      <div class="field">
        <label>Réglette prémémorisée</label>
        <select id="reg-preset" onchange="applyPreset()">
          <option value="">— Sélectionner —</option>
        </select>
      </div>
    </div>

    <!-- GUIDE -->
    <div class="section">
      <div class="section-title">Guide de correction</div>
      <div class="field">
        <label>Type</label>
        <select id="guide-type" onchange="updateGuideUI()">
          <option value="texte">Texte</option>
          <option value="tableau">Tableau (label → valeur)</option>
        </select>
      </div>
      <div id="guide-extra">
        <div class="field"><textarea id="guide-texte" rows="3" placeholder="Réponse attendue…"></textarea></div>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="actions">
      <button class="btn-primary" id="btn-publier" onclick="publier()">Publier sur GitHub</button>
      <button class="btn-secondary" onclick="resetForm()">Réinitialiser</button>
      <span id="publish-status" style="font-size:.82rem;color:var(--ink-3)"></span>
    </div>

  </div><!-- /container -->
</div><!-- /app -->

<div id="toast"></div>

<script>
// ── TOKEN ─────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', init);

function saveToken() {
  localStorage.setItem('gh_token', document.getElementById('gh-token').value);
  document.getElementById('token-status').textContent = '';
}
function getToken() { return document.getElementById('gh-token').value || localStorage.getItem('gh_token') || ''; }

// ── INIT ──────────────────────────────────────────────────────────────
const OWNER = 'sbergeronencp002';
const REPO  = 'hqccssbf';
const BRANCH = 'main';

function updatePeriodes() {
  const niveau = document.getElementById('q-niveau').value;
  const periodes = PERIODES_PAR_NIVEAU[niveau] || [];
  const sel = document.getElementById('q-periode');
  sel.innerHTML = periodes.map(p => `<option value="${p}">${p}</option>`).join('');
  updateAspects();
}

function updateAspects() {
  const periode = document.getElementById('q-periode').value;
  const aspects = ASPECTS_PAR_PERIODE[periode] || [];
  const wrap = document.getElementById('aspects-list');
  wrap.innerHTML = aspects.map(a =>
    `<label style="display:flex;align-items:center;gap:.5rem;font-size:.83rem;cursor:pointer">
      <input type="checkbox" value="${a}" style="width:auto;cursor:pointer"> ${a}
    </label>`
  ).join('');
}

function updatePresets() {
  const oi = document.getElementById('q-oi').value;
  const presets = REGLETTES_PRESET[oi] || [];
  const sel = document.getElementById('reg-preset');
  sel.innerHTML = '<option value="">— Sélectionner —</option>'
    + presets.map((p,i) => `<option value="${i}">${p.label}</option>`).join('');
}

function applyPreset() {
  // Selection is stored in reg-preset; no manual fields to populate
}

// ── MODE ÉDITION ──────────────────────────────────────────────────────
let editingId = null;

function setMode(mode) {
  const wrap = document.getElementById('edit-select-wrap');
  if(mode === 'edit') {
    wrap.style.display = '';
    populateEditSelect();
  } else {
    wrap.style.display = 'none';
    editingId = null;
    const nums = currentQuestions.map(q => parseInt(q.id.replace(/\D/g,''))).filter(n=>!isNaN(n));
    const nextId = nums.length ? 'Q' + (Math.max(...nums)+1) : 'Q1';
    document.getElementById('q-id').value = nextId;
    document.getElementById('next-id-badge').textContent = nextId;
    resetForm(true);
  }
}

function populateEditSelect() {
  const sel = document.getElementById('edit-q-select');
  sel.innerHTML = '<option value="">— Choisir —</option>'
    + currentQuestions.map(q => `<option value="${q.id}">${q.id} — ${q.oi.split(' ').slice(0,3).join(' ')} (${q.periode})</option>`).join('');
}

function loadQuestion(id) {
  const btnSuppr = document.getElementById('btn-supprimer');
  if(!id) { editingId = null; if(btnSuppr) btnSuppr.disabled = true; return; }
  const q = currentQuestions.find(x => x.id === id);
  const r = currentReglettes[id];
  if(!q) return;
  editingId = id;
  if(btnSuppr) btnSuppr.disabled = false;

  document.getElementById('q-id').value = q.id;
  document.getElementById('next-id-badge').textContent = q.id;
  document.getElementById('q-niveau').value = String(q.niveau);
  updatePeriodes();
  document.getElementById('q-periode').value = q.periode;
  updateAspects();
  const aspectValues = new Set((q.aspects||[]).map(a=>a.aspect));
  document.querySelectorAll('#aspects-list input[type=checkbox]').forEach(cb => { cb.checked = aspectValues.has(cb.value); });
  document.getElementById('q-oi').value = q.oi;
  updatePresets();
  document.getElementById('q-enonce').value = q.enonce || '';

  document.getElementById('docs-list').innerHTML = '';
  docCount = 0; colCount = 0;
  (q.documents||[]).forEach(d => {
    if(d.type==='textes' && d.cols) {
      if(d.cols.length===1) {
        const col = d.cols[0];
        if(col.ref) {
          addDoc('image');
          document.getElementById('doc-'+docCount+'-titre').value = col.titre||'';
          const s = document.getElementById('doc-'+docCount+'-ref');
          if(s) s.value = col.ref;
        } else {
          addDoc('textes');
          document.getElementById('doc-'+docCount+'-titre').value = col.titre||'';
          document.getElementById('doc-'+docCount+'-texte').value = col.texte||'';
        }
      } else {
        addDoc('textes-image');
        const docId = docCount;
        d.cols.forEach(col => {
          if(col.ref) {
            addCol(docId,'image');
            document.getElementById('col-'+colCount+'-titre').value = col.titre||'';
            const s = document.getElementById('col-'+colCount+'-ref');
            if(s) s.value = col.ref;
          } else {
            addCol(docId,'texte');
            document.getElementById('col-'+colCount+'-titre').value = col.titre||'';
            document.getElementById('col-'+colCount+'-texte').value = col.texte||'';
          }
        });
      }
    }
  });

  const repType = q.reponse ? (q.reponse===true?'none':q.reponse.type) : 'none';
  document.getElementById('rep-type').value = repType;
  updateReponseUI();
  if(repType==='lignes') document.getElementById('rep-nombre').value = q.reponse.nombre||2;
  else if(repType==='image_ligne') { const s=document.getElementById('rep-ref'); if(s) s.value=q.reponse.ref||''; }
  else if(repType==='tableau') document.getElementById('rep-lignes').value = (q.reponse.lignes||[]).map(l=>l.label).join('\n');

  if(r) {
    const rOi = r.oi || q.oi;
    const presets = REGLETTES_PRESET[rOi] || [];
    let matchIdx = -1;
    if(r.variante) {
      matchIdx = presets.findIndex(p => p.variante === r.variante);
    } else {
      matchIdx = presets.findIndex(p => !p.variante && p.niveaux?.[0]?.desc === r.niveaux?.[0]?.desc);
    }
    if(matchIdx !== -1) document.getElementById('reg-preset').value = String(matchIdx);
  }

  if(q.guide && typeof q.guide==='string') {
    document.getElementById('guide-type').value='texte'; updateGuideUI();
    document.getElementById('guide-texte').value = q.guide;
  } else if(q.guide && q.guide.type==='tableau') {
    document.getElementById('guide-type').value='tableau'; updateGuideUI();
    document.getElementById('guide-tableau').value = (q.guide.lignes||[]).map(l=>l.label+' | '+l.valeur).join('\n');
  } else {
    document.getElementById('guide-type').value='texte'; updateGuideUI();
    document.getElementById('guide-texte').value='';
  }
}

// ── SUPPRIMER QUESTION ────────────────────────────────────────────────
async function supprimerQuestion() {
  if(!editingId) return;
  if(!confirm(`Supprimer ${editingId} et renuméroter toutes les questions ?`)) return;
  const token = getToken();
  if(!token) { toast('Saisis ton token GitHub.', 'err'); return; }

  const btn = document.getElementById('btn-supprimer');
  btn.disabled = true; btn.textContent = '⏳ Suppression…';

  try {
    const idSupp = editingId;

    // Retirer la question et sa réglette
    currentQuestions = currentQuestions.filter(q => q.id !== idSupp);
    delete currentReglettes[idSupp];

    // Renuméroter Q1, Q2, Q3…
    const oldToNew = {};
    currentQuestions = currentQuestions.map((q, i) => {
      const newId = 'Q' + (i + 1);
      oldToNew[q.id] = newId;
      return { ...q, id: newId };
    });

    // Re-clé des réglettes
    const newReglettes = {};
    Object.entries(currentReglettes).forEach(([oldId, r]) => {
      const newId = oldToNew[oldId];
      if(newId) newReglettes[newId] = r;
    });
    currentReglettes = newReglettes;

    // SHA frais
    const shaResp = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/questions.js?ref=${BRANCH}`,
      { headers: { Authorization: `token ${token}` } });
    const shaData = await shaResp.json();
    questionsFileSha = shaData.sha;

    const newContent = generateQuestionsJs(currentQuestions, currentReglettes, currentImageDb);
    const encoded = btoa(unescape(encodeURIComponent(newContent)));

    const putResp = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/questions.js`, {
      method: 'PUT',
      headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `Supprimer ${idSupp} et renuméroter`,
        content: encoded, sha: questionsFileSha, branch: BRANCH
      })
    });
    if(!putResp.ok) { const err = await putResp.json(); throw new Error(err.message || putResp.status); }

    const result = await putResp.json();
    questionsFileSha = result.content.sha;

    toast(`${idSupp} supprimé, questions renumérotées.`, 'ok');
    editingId = null;
    resetForm(false);
    const nextId = 'Q' + (currentQuestions.length + 1);
    document.getElementById('q-id').value = nextId;
    document.getElementById('next-id-badge').textContent = nextId;

  } catch(e) {
    toast('Erreur : ' + e.message, 'err');
    console.error(e);
  } finally {
    btn.textContent = '🗑 Supprimer cette question';
    btn.disabled = true;
  }
}

// ── UPLOAD IMAGE ──────────────────────────────────────────────────────
function onUploadFileChange() {
  const file = document.getElementById('upload-file').files[0];
  if(!file) return;
  const nameField = document.getElementById('upload-name');
  if(!nameField.value) nameField.value = file.name;
}

async function uploadImage() {
  const token = getToken();
  if(!token) { toast('Saisis ton token GitHub.', 'err'); return; }
  const file = document.getElementById('upload-file').files[0];
  if(!file) { toast('Sélectionne un fichier image.', 'err'); return; }
  const name = (document.getElementById('upload-name').value.trim() || file.name).replace(/\s+/g,'_');
  const statusEl = document.getElementById('upload-status');
  const btn = document.getElementById('btn-upload');
  btn.disabled = true; statusEl.textContent = '⏳ Téléversement…';
  try {
    const b64 = await new Promise((res,rej) => {
      const reader = new FileReader();
      reader.onload = e => res(e.target.result.split(',')[1]);
      reader.onerror = rej;
      reader.readAsDataURL(file);
    });
    const putResp = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/images/${name}`, {
      method:'PUT',
      headers:{ Authorization:`token ${token}`, 'Content-Type':'application/json' },
      body: JSON.stringify({ message:`Ajouter image : ${name}`, content:b64, branch:BRANCH })
    });
    if(!putResp.ok) { const err=await putResp.json(); throw new Error(err.message||putResp.status); }
    statusEl.textContent = `✓ ${name} téléversé !`;
    document.getElementById('upload-file').value='';
    document.getElementById('upload-name').value='';
    await loadImages();
    toast(`"${name}" ajouté aux images.`, 'ok');
  } catch(e) {
    statusEl.textContent = '✗ ' + e.message;
    toast('Erreur : ' + e.message, 'err');
  } finally { btn.disabled = false; }
}

let IMAGES = [];
let currentQuestions = [];
let currentReglettes = {};
let currentImageDb = {};
let questionsFileSha = '';

async function init() {
  const token = localStorage.getItem('gh_token');
  if(token) document.getElementById('gh-token').value = token;
  updatePeriodes();
  updatePresets();
  await Promise.all([loadQuestionsJs(), loadImages()]);
}

async function loadImages() {
  try {
    const headers = getToken() ? { Authorization: `token ${getToken()}` } : {};
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/images?ref=${BRANCH}`, { headers });
    const data = await r.json();
    if(Array.isArray(data)) {
      IMAGES = data.filter(f => f.name !== '.gitkeep').map(f => f.name).sort();
    }
  } catch(e) { /* utilise la liste vide */ }
}

async function loadQuestionsJs() {
  try {
    const headers = getToken() ? { Authorization: `token ${getToken()}` } : {};
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/questions.js?ref=${BRANCH}`, { headers });
    if(!r.ok) throw new Error(r.status);
    const data = await r.json();
    questionsFileSha = data.sha;
    const binary = atob(data.content.replace(/\n/g,''));
    const bytes = new Uint8Array(binary.length);
    for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const content = new TextDecoder('utf-8').decode(bytes);
    const fn = new Function(content + '\n return { REGLETTES, IMAGE_DB, QUESTIONS };');
    const result = fn();
    currentQuestions = result.QUESTIONS;
    currentReglettes = result.REGLETTES;
    currentImageDb   = result.IMAGE_DB;
    // Next ID
    const nums = currentQuestions.map(q => parseInt(q.id.replace(/\D/g,''))).filter(n=>!isNaN(n));
    const nextNum = nums.length ? Math.max(...nums) + 1 : 1;
    const nextId = 'Q' + nextNum;
    document.getElementById('q-id').value = nextId;
    document.getElementById('next-id-badge').textContent = nextId;
    document.getElementById('token-status').textContent = '✓ Connecté';
    document.getElementById('token-status').className = 'token-status ok';
  } catch(e) {
    document.getElementById('token-status').textContent = '✗ Erreur de connexion';
    document.getElementById('token-status').className = 'token-status ko';
  }
}

document.getElementById('gh-token').addEventListener('change', loadQuestionsJs);

    div.innerHTML = `
      <div class="block-title">Document texte</div>

      <div class="field"><label>Titre</label><input type="text" id="doc-${id}-titre" placeholder="Document A"></div>
      <div class="field"><label>Texte</label><textarea id="doc-${id}-texte" rows="4" placeholder="Contenu du document…"></textarea></div>`;
  } else if(type === 'image') {
    div.innerHTML = `
      <div class="block-title">Document image</div>

      <div class="field"><label>Titre</label><input type="text" id="doc-${id}-titre" placeholder="Document A"></div>

      <div class="field"><label>Texte</label><textarea id="col-${id}-texte" rows="3"></textarea></div>`;

    div.innerHTML = `
      <button class="btn-remove" onclick="removeEl('col-${id}')">✕</button>

function imageSelect(id) {

}

function removeEl(id) { document.getElementById(id)?.remove(); }

// ── BUILD QUESTION OBJECT ─────────────────────────────────────────────
function buildQuestion() {
  const id = document.getElementById('q-id').value.trim();
  const niveau = parseInt(document.getElementById('q-niveau').value);
  const oi = document.getElementById('q-oi').value;
  const periode = document.getElementById('q-periode').value;
  const enonce = document.getElementById('q-enonce').value.trim();
  const aspects = [...document.querySelectorAll('#aspects-list input[type=checkbox]:checked')]
    .map(cb => ({ aspect: cb.value }));
  const presetIdx = parseInt(document.getElementById('reg-preset').value);
  const presetOi = document.getElementById('q-oi').value;
  const preset = !isNaN(presetIdx) ? (REGLETTES_PRESET[presetOi] || [])[presetIdx] : null;
  let points = 2;
  if(preset) {
    if(preset.variante) points = 3;
    else if(preset.niveaux?.length) points = Math.max(...preset.niveaux.map(n => n.pts));
  }

  // Documents
  const documents = [];
  document.querySelectorAll('#docs-list > .block').forEach(docEl => {
    const dtype = docEl.dataset.type;
    if(dtype === 'textes') {
      const titre = docEl.querySelector('[id$="-titre"]').value.trim();
      const texte = docEl.querySelector('[id$="-texte"]').value.trim();
      documents.push({ type: 'textes', cols: [{ titre, texte }] });
    } else if(dtype === 'image') {
      const titre = docEl.querySelector('[id$="-titre"]').value.trim();
      const ref = docEl.querySelector('[id$="-ref"]').value;
      documents.push({ type: 'textes', cols: [{ titre, ref }] });
    } else if(dtype === 'textes-image') {
      const cols = [];
      docEl.querySelectorAll('.col-block').forEach(colEl => {
        const ctype = colEl.dataset.type;
        const titre = colEl.querySelector('[id$="-titre"]').value.trim();
        if(ctype === 'texte') {
          const texte = colEl.querySelector('[id$="-texte"]').value.trim();
          cols.push({ titre, texte });
        } else {
          const ref = colEl.querySelector('[id$="-ref"]').value;
          cols.push({ titre, ref });
        }
      });
      if(cols.length) documents.push({ type: 'textes', cols });
    }
  });

  // Réponse
  let reponse = false;
  const repType = document.getElementById('rep-type').value;
  if(repType === 'lignes') {
    reponse = { type: 'lignes', nombre: parseInt(document.getElementById('rep-nombre').value) };
  } else if(repType === 'image_ligne') {
    reponse = { type: 'image_ligne', ref: document.getElementById('rep-ref').value };
  } else if(repType === 'tableau') {
    const lignes = document.getElementById('rep-lignes').value.trim().split('\n').map(s=>s.trim()).filter(Boolean).map(s=>({ label: s }));
    reponse = { type: 'tableau', lignes };
  }

  // Guide
  let guide = false;
  const guideType = document.getElementById('guide-type').value;
  if(guideType === 'texte') {
    guide = document.getElementById('guide-texte').value.trim() || false;
  } else {
    const lignes = document.getElementById('guide-tableau').value.trim().split('\n').map(s=>s.trim()).filter(Boolean).map(s => {
      const [label, valeur=''] = s.split('|').map(x=>x.trim());
      return { label, valeur };
    });
    guide = { type: 'tableau', lignes };
  }

  return { id, niveau, oi, periode, points, enonce, aspects, documents, reponse, guide };
}

function buildReglette(id) {
  const oi = document.getElementById('q-oi').value;
  const idx = parseInt(document.getElementById('reg-preset').value);
  if(isNaN(idx)) return { oi, colonnes:[], niveaux:[] };
  const preset = (REGLETTES_PRESET[oi] || [])[idx];
  if(!preset) return { oi, colonnes:[], niveaux:[] };
  const { label, ...rest } = preset;
  return { oi, ...rest };
}

// ── GENERATE questions.js ─────────────────────────────────────────────
function serializeValue(v, indent=0) {
  const pad = '  '.repeat(indent);
  const pad1 = '  '.repeat(indent+1);
  if(v === null || v === false || v === true) return String(v);
  if(typeof v === 'number') return String(v);
  if(typeof v === 'string') return JSON.stringify(v);
  if(Array.isArray(v)) {
    if(!v.length) return '[]';
    const items = v.map(i => pad1 + serializeValue(i, indent+1));
    return '[\n' + items.join(',\n') + '\n' + pad + ']';
  }
  const pairs = Object.entries(v).map(([k,val]) => {
    const key = /^[a-zA-Z_$][a-zA-Z0-9_$]*$/.test(k) ? k : JSON.stringify(k);
    return pad1 + key + ': ' + serializeValue(val, indent+1);
  });
  return '{\n' + pairs.join(',\n') + '\n' + pad + '}';
}

function generateQuestionsJs(questions, reglettes, imageDb) {
  let out = 'const REGLETTES = {\n';
  out += Object.entries(reglettes).map(([k,v]) => `  ${JSON.stringify(k)}: ${serializeValue(v,1)}`).join(',\n');
  out += '\n}\n\nconst IMAGE_DB = {\n';
  out += Object.entries(imageDb).map(([k,v]) => `  ${JSON.stringify(k)}: ${serializeValue(v,1)}`).join(',\n');
  out += '\n}\n\nconst QUESTIONS = [\n';
  out += questions.map(q => '  ' + serializeValue(q,1)).join(',\n');
  out += '\n]\n';
  return out;
}

// ── VALIDATION ────────────────────────────────────────────────────────
function validateForm() {
  const errors = [];
  if(!document.getElementById('q-id').value.trim()) errors.push('ID manquant');
  if(!document.getElementById('q-enonce').value.trim()) errors.push('Énoncé vide');
  if(!document.querySelectorAll('#aspects-list input[type=checkbox]:checked').length) errors.push('Aucun aspect sélectionné');
  const repType = document.getElementById('rep-type').value;
  if(repType === 'image_ligne' && !document.getElementById('rep-ref')?.value) errors.push('Image de réponse non sélectionnée');
  if(repType === 'tableau' && !document.getElementById('rep-lignes')?.value.trim()) errors.push('Lignes du tableau réponse vides');
  if(document.getElementById('reg-preset').value === '') errors.push('Réglette non sélectionnée');
  return errors;
}

// ── PUBLIER ───────────────────────────────────────────────────────────
async function publier() {
  const token = getToken();
  if(!token) { toast('Saisis ton token GitHub.', 'err'); return; }
  const errors = validateForm();
  if(errors.length) { toast('Champs manquants : ' + errors.join(', '), 'err'); return; }

  const btn = document.getElementById('btn-publier');
  const status = document.getElementById('publish-status');
  btn.disabled = true;
  btn.textContent = '⏳ Publication…';
  status.textContent = '';

  try {
    // Reload SHA
    const shaResp = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/questions.js?ref=${BRANCH}`,
      { headers: { Authorization: `token ${token}` } });
    const shaData = await shaResp.json();
    questionsFileSha = shaData.sha;

    const q = buildQuestion();
    const r = buildReglette(q.id);

    // Add image to IMAGE_DB if not present
    const refsUsed = new Set();
    q.documents.forEach(d => d.cols?.forEach(c => { if(c.ref) refsUsed.add(c.ref); }));
    if(q.reponse?.ref) refsUsed.add(q.reponse.ref);
    refsUsed.forEach(ref => {
      if(!currentImageDb[ref]) currentImageDb[ref] = { src: 'images/' + ref };
    });

    if(editingId) {
      const idx = currentQuestions.findIndex(x => x.id === editingId);
      if(idx !== -1) currentQuestions[idx] = q; else currentQuestions.push(q);
    } else {
      currentQuestions.push(q);
    }
    currentReglettes[q.id] = r;

    const newContent = generateQuestionsJs(currentQuestions, currentReglettes, currentImageDb);
    const encoded = btoa(unescape(encodeURIComponent(newContent)));

    const putResp = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/questions.js`, {
      method: 'PUT',
      headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: editingId ? `Modifier ${q.id} — ${q.oi}` : `Ajouter ${q.id} — ${q.oi} (${q.periode})`,
        content: encoded,
        sha: questionsFileSha,
        branch: BRANCH
      })
    });

    if(!putResp.ok) {
      const err = await putResp.json();
      throw new Error(err.message || putResp.status);
    }

    // Update local state
    const result = await putResp.json();
    questionsFileSha = result.content.sha;
    // Next ID
    const nums = currentQuestions.map(q=>parseInt(q.id.replace(/\D/g,''))).filter(n=>!isNaN(n));
    const nextId = 'Q' + (Math.max(...nums)+1);
    document.getElementById('q-id').value = nextId;
    document.getElementById('next-id-badge').textContent = nextId;

    toast(editingId ? `${q.id} modifié !` : `${q.id} publié !`, 'ok');
    status.textContent = `✓ ${q.id} ${editingId?'modifié':'ajouté'} — ${new Date().toLocaleTimeString('fr-CA')}`;
    editingId = null;
    resetForm(true);

  } catch(e) {
    toast('Erreur : ' + e.message, 'err');
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Publier sur GitHub';
  }
}

// ── RESET ─────────────────────────────────────────────────────────────
function resetForm(keepId=false) {
  editingId = null;
  const newRadio = document.querySelector('input[name="mode"][value="new"]');
  if(newRadio) { newRadio.checked = true; document.getElementById('edit-select-wrap').style.display='none'; }
  if(!keepId) document.getElementById('q-id').value = '';
  document.getElementById('q-niveau').value = '3';
  document.getElementById('q-oi').value = document.getElementById('q-oi').options[0].value;
  document.getElementById('q-periode').value = document.getElementById('q-periode').options[0].value;
  document.getElementById('q-enonce').value = '';
  updatePeriodes();
  document.getElementById('docs-list').innerHTML = '';
  document.getElementById('rep-type').value = 'none';
  document.getElementById('rep-extra').innerHTML = '';
  document.getElementById('reg-preset').value = '';
  document.getElementById('guide-type').value = 'texte';
  docCount = 0; colCount = 0;
  updateGuideUI();
}

// ── TOAST ─────────────────────────────────────────────────────────────
function toast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = type;
  el.style.display = 'block';
  setTimeout(()=>{ el.style.display='none'; }, 3500);
}
