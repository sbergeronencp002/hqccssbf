<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Admin — HQC · CSSBF</title>
<script src="reglettes.js?v=2"></script>
<script src="contexte.js"></script>
<script src="oi-config.js?v=1"></script>
<script src="questions-io.js?v=2"></script>
<style>
:root {
  --ink: #1a1814; --ink-2: #4a4740; --ink-3: #8a8680;
  --paper: #f7f4ef; --paper-2: #ede9e2; --paper-3: #e2ddd5;
  --accent: #1B3B6F; --border: rgba(26,24,20,0.15);
  --green: #1a5c3a; --red: #c0392b;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans','Segoe UI',Helvetica,Arial,sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }

/* ── HEADER ── */
header { background: var(--accent); color: #fff; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 1.2rem; font-weight: 500; }
header a { color: rgba(255,255,255,.7); font-size: .8rem; text-decoration: none; }
header a:hover { color: #fff; }

/* ── LAYOUT ── */
#app { display: flex; flex-direction: column; min-height: 100vh; }
.container { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem; }

/* ── TOKEN BAR ── */
.token-bar { background: var(--paper-2); border: 1px solid var(--border); border-radius: 7px; padding: .75rem 1rem; display: flex; gap: .75rem; align-items: center; margin-bottom: 2rem; }
.token-bar label { font-size: .75rem; font-weight: 600; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.token-bar input { flex: 1; padding: .4rem .6rem; border: 1px solid var(--border); border-radius: 4px; font-size: .8rem; font-family: monospace; }
.token-status { font-size: .75rem; white-space: nowrap; }
.token-status.ok { color: var(--green); }
.token-status.ko { color: var(--red); }

/* ── SECTION ── */
.section { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
.section-title { font-size: .65rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-bottom: 1rem; }

/* ── FORM ── */
.field { margin-bottom: 1rem; }
.field label { display: block; font-size: .75rem; font-weight: 600; color: var(--ink-2); margin-bottom: .35rem; }
.field input, .field select, .field textarea {
  width: 100%; padding: .5rem .75rem; border: 1px solid var(--border);
  border-radius: 5px; font-family: inherit; font-size: .85rem; color: var(--ink);
  background: var(--paper); transition: border-color .15s;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 80px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }

/* ── DYNAMIC BLOCKS ── */
.block { border: 1px solid var(--border); border-radius: 6px; padding: 1rem; margin-bottom: .75rem; position: relative; background: var(--paper); }
.block-title { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin-bottom: .75rem; }
.btn-remove { position: absolute; top: .6rem; right: .6rem; background: none; border: none; color: var(--ink-3); font-size: 1.1rem; cursor: pointer; padding: 0 .2rem; line-height: 1; }
.btn-remove:hover { color: var(--red); }
.btn-add { display: inline-flex; align-items: center; gap: .4rem; padding: .4rem .9rem; background: var(--paper-2); border: 1px dashed var(--border); border-radius: 5px; font-size: .78rem; color: var(--ink-2); cursor: pointer; margin-top: .25rem; transition: all .15s; }
.btn-add:hover { background: var(--paper-3); color: var(--ink); border-style: solid; }

/* ── COLS ── */
.col-block { border: 1px solid var(--border); border-radius: 5px; padding: .75rem; margin-bottom: .5rem; background: #fff; position: relative; }
.col-type-toggle { display: flex; gap: .4rem; margin-bottom: .6rem; }
.col-type-toggle button { padding: .25rem .6rem; border: 1px solid var(--border); border-radius: 4px; font-size: .72rem; cursor: pointer; background: var(--paper); color: var(--ink-2); }
.col-type-toggle button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ── NIVEAU CHIPS ── */
.niveau-row { display: flex; align-items: center; gap: .6rem; margin-bottom: .5rem; }
.niveau-row input[type=number] { width: 60px; }
.niveau-row input[type=text] { flex: 1; }
.niveau-row .btn-remove { position: static; }

/* ── ACTIONS ── */
.actions { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-top: 1rem; }
.btn-primary { padding: .65rem 1.5rem; background: var(--green); color: #fff; border: none; border-radius: 6px; font-size: .9rem; font-weight: 600; cursor: pointer; transition: opacity .15s; }
.btn-primary:hover { opacity: .88; }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; }
.btn-secondary { padding: .6rem 1.2rem; background: var(--paper-2); border: 1px solid var(--border); border-radius: 6px; font-size: .85rem; cursor: pointer; }
.btn-secondary:hover { background: var(--paper-3); }
.btn-danger { padding: .6rem 1.2rem; background: var(--red); color: #fff; border: none; border-radius: 6px; font-size: .85rem; cursor: pointer; opacity: .85; }
.btn-danger:hover { opacity: 1; }
.btn-danger:disabled { opacity: .35; cursor: not-allowed; }

/* ── TOAST ── */
#toast { position: fixed; bottom: 1.5rem; right: 1.5rem; padding: .75rem 1.25rem; border-radius: 7px; font-size: .85rem; font-weight: 500; display: none; z-index: 999; color: #fff; }
#toast.ok { background: var(--green); }
#toast.err { background: var(--red); }

/* ── ID badge ── */
.id-badge { display: inline-block; background: var(--accent); color: #fff; font-size: .7rem; font-weight: 700; padding: .15rem .5rem; border-radius: 4px; letter-spacing: .05em; }
/* ── GUIDE GRILLE ── */
.guide-grille { border-collapse: collapse; width: 100%; margin-top: .25rem; }
.guide-grille th, .guide-grille td { border: 1px solid var(--border); padding: 0; }
.guide-grille-num { width: 26px; text-align: center; font-size: .68rem; color: var(--ink-3); background: var(--paper-2); padding: 0 4px; }
.guide-grille th { background: var(--paper-2); }
.guide-grille input { width: 100%; border: none; padding: .34rem .55rem; font-size: .82rem; background: transparent; font-family: inherit; color: var(--ink); min-width: 80px; }
.guide-grille input:focus { outline: none; background: rgba(27,59,111,0.05); }
.guide-grille-entete { font-weight: 600; }

.soustag-pill {
  display:inline-flex; align-items:center; gap:4px;
  padding:4px 11px; border-radius:20px;
  border:1.5px solid var(--border);
  font-size:.75rem; font-weight:500; color:var(--ink-2);
  cursor:pointer; user-select:none;
  transition:background .15s, color .15s, border-color .15s;
  background:var(--paper);
}
.soustag-pill input { position:absolute; opacity:0; width:0; height:0; pointer-events:none; }
.soustag-pill:has(input:checked) { background:#1B3B6F; color:#fff; border-color:#1B3B6F; }
.soustag-pill:hover:not(:has(input:checked)) { border-color:var(--ink-2); color:var(--ink); }
.dash-grid { display:flex; gap:1.25rem; margin-bottom:1.25rem; align-items:flex-start; }
.dash-col { flex:1; min-width:0; }
.dash-col.collapsed { flex:0 0 auto; }
.dash-niv-title { font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); margin-bottom:.6rem; }
.dash-row { display:flex; align-items:center; gap:.5rem; margin-bottom:.35rem; }
.dash-label { font-size:.72rem; color:var(--ink-2); white-space:nowrap; min-width:120px; overflow:hidden; text-overflow:ellipsis; }
.dash-bar-wrap { flex:1; background:var(--paper-3); border-radius:4px; height:8px; min-width:40px; overflow:hidden; }
.dash-bar { height:100%; border-radius:4px; transition:width .4s ease; }
.dash-count { font-size:.7rem; color:var(--ink-3); white-space:nowrap; min-width:108px; text-align:right; }
.dash-divider { border:none; border-top:1px solid var(--border); margin:.75rem 0; }
.dash-oi-row { display:flex; align-items:center; gap:.5rem; margin-bottom:.3rem; }
.dash-oi-label { font-size:.72rem; color:var(--ink-2); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dash-oi-count { font-size:.7rem; color:var(--ink-3); white-space:nowrap; min-width:60px; text-align:right; }
.dash-row-clickable { cursor:pointer; border-radius:4px; padding:2px 4px; margin-left:-4px; transition:background .15s; }
.dash-row-clickable:hover { background:var(--paper-2); }
.dash-chevron { font-size:.55rem; color:var(--ink-3); transition:transform .2s; flex-shrink:0; }
.dash-row-clickable.open .dash-chevron { transform:rotate(180deg); }
.dash-period-detail { margin:.15rem 0 .55rem 1rem; padding-left:.6rem; border-left:2px solid var(--paper-3); }
.dash-sub-row { display:flex; align-items:center; gap:.5rem; margin-bottom:.2rem; }
.dash-sub-label { font-size:.68rem; color:var(--ink-2); flex:0 0 auto; width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dash-sub-bar-wrap { flex:1; background:var(--paper-3); border-radius:3px; height:5px; overflow:hidden; min-width:20px; }
.dash-sub-bar { height:100%; border-radius:3px; transition:width .4s ease; }
.dash-sub-count { font-size:.66rem; color:var(--ink-3); white-space:nowrap; min-width:80px; text-align:right; }
.dash-n4-toggle { font-size:.7rem; color:var(--ink-3); cursor:pointer; border:none; background:none; padding:0; margin-bottom:.3rem; text-decoration:underline dotted; }
.dash-n4-toggle:hover { color:var(--ink-1); }

.rich-toolbar { display:flex; gap:4px; margin-bottom:10px; }
.rich-toolbar button { font-size:.75rem; padding:2px 8px; border:1px solid var(--border); border-radius:4px; background:var(--paper-2); cursor:pointer; color:var(--ink); }
.rich-toolbar button:hover { background:var(--paper-3); }

.edit-search-row { display:flex; gap:.5rem; margin-bottom:.6rem; flex-wrap:wrap; }
.edit-search-row input { flex:1; min-width:160px; padding:.45rem .7rem; border:1px solid var(--border); border-radius:6px; font-size:.85rem; font-family:inherit; background:var(--paper); color:var(--ink); }
.edit-search-row input:focus { outline:none; border-color:var(--accent); }
.edit-search-row select { padding:.45rem .7rem; border:1px solid var(--border); border-radius:6px; font-size:.82rem; font-family:inherit; background:var(--paper); color:var(--ink); cursor:pointer; }
.edit-search-row select:focus { outline:none; border-color:var(--accent); }

.edit-results { max-height:260px; overflow-y:auto; border:1px solid var(--border); border-radius:6px; background:var(--paper); }
.edit-result-card { padding:.55rem .85rem; cursor:pointer; border-bottom:1px solid var(--border); display:flex; align-items:baseline; gap:.5rem; transition:background .1s; }
.edit-result-card:last-child { border-bottom:none; }
.edit-result-card:hover { background:var(--paper-2); }
.edit-result-card.selected { background:rgba(27,59,111,0.07); }
.edit-card-id { font-size:.8rem; font-weight:700; color:var(--ink); white-space:nowrap; }
.edit-card-warn { color:#c0392b; font-size:.75rem; }
.edit-card-meta { font-size:.78rem; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.edit-card-enonce { font-size:.76rem; color:var(--ink-3); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-style:italic; }
.edit-card-sub { font-size:.72rem; color:var(--ink-3); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.edit-result-card.focused { background:var(--paper-2); outline:2px solid rgba(27,59,111,0.25); outline-offset:-2px; }
.edit-results-empty { padding:.75rem 1rem; font-size:.82rem; color:var(--ink-3); font-style:italic; }

.edit-selected-bar { margin-top:.75rem; padding:.6rem .85rem; background:rgba(27,59,111,0.06); border:1px solid rgba(27,59,111,0.18); border-radius:6px; display:flex; align-items:center; justify-content:space-between; gap:.75rem; flex-wrap:wrap; }
.edit-selected-label { font-size:.82rem; font-weight:600; color:#1B3B6F; }

/* ── ANCHOR NAV ── */
.anchor-nav { position:sticky; top:0; z-index:20; background:var(--paper-2); border-bottom:1px solid var(--border); margin:0 -1.5rem 1.5rem; padding:.4rem 1.5rem; display:flex; gap:.25rem; flex-wrap:wrap; }
.anchor-nav a { font-size:.72rem; font-weight:600; color:var(--ink-2); text-decoration:none; padding:.22rem .65rem; border-radius:4px; transition:background .12s,color .12s; white-space:nowrap; }
.anchor-nav a:hover { background:var(--paper-3); color:var(--ink); }

/* ── MOVE BUTTONS ── */
.btn-move { position:absolute; top:.55rem; background:none; border:none; color:var(--ink-3); font-size:.85rem; cursor:pointer; padding:0 .15rem; line-height:1.2; }
.btn-move-up { right:3.8rem; }
.btn-move-dn { right:2.5rem; }
.btn-move:hover { color:var(--accent); }
</style>
</head>
<body>

<!-- APP -->
<div id="app">
  <header>
    <h1>HQC · CSSBF — Gestion des questions</h1>
    <div style="display:flex;gap:1.25rem;align-items:center">
      <a href="documents.html">🖼 Documents &amp; Images</a>
      <a href="index.html">← Retour au site</a>
    </div>
  </header>

  <div class="container">

    <!-- TOKEN -->
    <div class="token-bar">
      <label>Token GitHub</label>
      <input type="password" id="gh-token" placeholder="ghp_..." autocomplete="off" oninput="saveToken()">
      <label style="display:flex;align-items:center;gap:.3rem;font-size:.75rem;white-space:nowrap;cursor:pointer">
        <input type="checkbox" id="gh-remember" onchange="saveToken()"> Mémoriser
      </label>
      <span class="token-status" id="token-status"></span>
    </div>

    <!-- ANCHOR NAV -->
    <nav class="anchor-nav">
      <a href="#section-contexte">Contexte</a>
      <a href="#section-question">Question</a>
      <a href="#section-docs">Documents</a>
      <a href="#section-upload">Image</a>
      <a href="#section-reponse">Réponse</a>
      <a href="#section-reglette">Réglette</a>
      <a href="#section-guide">Guide</a>
      <a href="#section-actions">Publier ↓</a>
    </nav>

    <!-- TABLEAU DE BORD -->
    <div class="section" id="dashboard-section" style="display:none">
      <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="toggleDashboard()">
        <span>Tableau de bord — Couverture</span>
        <div style="display:flex;align-items:center;gap:10px">
          <span id="dashboard-total" style="font-size:.75rem;font-weight:600;color:var(--ink-2)"></span>
          <span id="dashboard-toggle-icon" style="font-size:.8rem;color:var(--ink-3);transition:transform .2s">▼</span>
        </div>
      </div>
      <div id="dashboard-content" style="display:none"></div>
    </div>

    <!-- MODE -->
    <div class="section">
      <div class="section-title">Mode</div>
      <div style="display:flex;gap:1.5rem;margin-bottom:.5rem">
        <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer;font-size:.85rem">
          <input type="radio" name="mode" value="new" checked onchange="setMode('new')"> Nouvelle question
        </label>
        <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer;font-size:.85rem">
          <input type="radio" name="mode" value="edit" onchange="setMode('edit')"> Modifier une question existante
        </label>
      </div>
      <div id="edit-select-wrap" style="display:none">
        <div class="edit-search-row">
          <input type="text" id="edit-search" placeholder="Rechercher — ID, OI, période, énoncé…"
            oninput="debouncedFilterEditList()" onkeydown="editKeyNav(event)">
          <select id="edit-filter-niveau" onchange="filterEditList()">
            <option value="">Tous les niveaux</option>
            <option value="3">Niveau 3</option>
            <option value="4">Niveau 4</option>
          </select>
          <select id="edit-filter-oi" onchange="filterEditList()">
            <option value="">Toutes les OI</option>
          </select>
        </div>
        <div id="edit-results-count" style="font-size:.72rem;color:var(--ink-3);margin-bottom:.3rem"></div>
        <div id="edit-results" class="edit-results"></div>
        <div id="edit-selected-bar" style="display:none" class="edit-selected-bar">
          <span id="edit-selected-label" class="edit-selected-label"></span>
          <div style="display:flex;gap:.5rem">
            <button class="btn-secondary" id="btn-dupliquer" onclick="dupliquerQuestion()" disabled>📋 Dupliquer</button>
            <button class="btn-danger" id="btn-supprimer" onclick="supprimerQuestion()" disabled>🗑 Supprimer</button>
          </div>
        </div>
      </div>
    </div>

    <!-- IDENTIFIANT -->
    <div class="section">
      <div class="section-title">Identifiant</div>
      <div class="field">
        <label>ID de la question <span id="next-id-badge" class="id-badge"></span></label>
        <input type="text" id="q-id" placeholder="Chargement…">
      </div>
    </div>

    <!-- CONTEXTE -->
    <div class="section" id="section-contexte">
      <div class="section-title">Contexte</div>
      <div class="row">
        <div class="field">
          <label>Niveau</label>
          <select id="q-niveau" onchange="updatePeriodes()">
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </div>
        <div class="field">
          <label>Période</label>
          <select id="q-periode" onchange="updateAspects()"></select>
        </div>
      </div>
      <div class="field">
        <label>Aspect(s)</label>
        <div id="aspects-list" style="display:flex;flex-direction:column;gap:.3rem;margin-top:.3rem;padding:.5rem;background:var(--paper);border:1px solid var(--border);border-radius:5px;max-height:180px;overflow-y:auto"></div>
      </div>
      <div class="field">
        <label>Opération intellectuelle</label>
        <!-- Options générées depuis OI_CONFIG (oi-config.js) par populateOiSelect() -->
        <select id="q-oi" onchange="updatePresets();updateSoustag();autoReponseFromOI()"></select>
      </div>
      <div class="field" id="soustag-row" style="display:none">
        <label>Sous-tag</label>
        <div id="soustag-pills" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      </div>
    </div>

    <!-- QUESTION -->
    <div class="section" id="section-question">
      <div class="section-title">Question</div>
      <div class="field">
        <div class="rich-toolbar">
          <button type="button" onclick="insertBold('q-enonce')"><b>G</b></button>
          <button type="button" onclick="insertBullet('q-enonce')">• Puce</button>
        </div>
        <textarea id="q-enonce" rows="4" placeholder="Texte de la question…"></textarea>
      </div>
    </div>

    <!-- DOCUMENTS -->
    <div class="section" id="section-docs">
      <div class="section-title">Documents</div>
      <div id="docs-list"></div>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap">
        <button class="btn-add" onclick="addDoc('textes')">+ Texte</button>
        <button class="btn-add" onclick="addDoc('image')">+ Image</button>
        <button class="btn-add" onclick="addDoc('textes-image')">+ Texte + Image (côte à côte)</button>
      </div>
    </div>

    <!-- UPLOAD IMAGE -->
    <div class="section" id="section-upload">
      <div class="section-title">Téléverser une image</div>
      <div class="row">
        <div class="field">
          <label>Fichier</label>
          <input type="file" id="upload-file" accept="image/*" onchange="onUploadFileChange()" style="padding:.3rem">
        </div>
        <div class="field">
          <label>Renommer <span style="font-weight:400;color:var(--ink-3)">(optionnel)</span></label>
          <input type="text" id="upload-name" placeholder="nom_du_fichier.png">
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:1rem;margin-top:.5rem">
        <button class="btn-secondary" id="btn-upload" onclick="uploadImage()">⬆ Téléverser dans GitHub</button>
        <span id="upload-status" style="font-size:.82rem;color:var(--ink-3)"></span>
      </div>
    </div>

    <!-- RÉPONSE -->
    <div class="section" id="section-reponse">
      <div class="section-title">Réponse</div>
      <div class="field">
        <label>Type de réponse</label>
        <select id="rep-type" onchange="updateReponseUI()">
          <option value="none">Aucune</option>
          <option value="lignes">Lignes de réponse</option>
          <option value="image">Image seule</option>

          <option value="tableau_2col">Tableau 2 colonnes (Réponse | vide)</option>
          <option value="grille">Tableau (grille visuelle)</option>
          <option value="avant-apres">Tableau Avant / Après</option>
          <option value="mettre-en-relation">Tableau Mettre en relation</option>
          <option value="situer-dans-lespace">Tableau Situer dans l'espace</option>
          <option value="cause-consequence">Tableau Cause / Conséquence</option>
        </select>
      </div>
      <div id="rep-extra"></div>
    </div>

    <!-- RÉGLETTE -->
    <div class="section" id="section-reglette">
      <div class="section-title">Réglette</div>
      <div class="field">
        <label>Réglette prémémorisée</label>
        <select id="reg-preset">
          <option value="">— Sélectionner —</option>
        </select>
      </div>
    </div>

    <!-- GUIDE -->
    <div class="section" id="section-guide">
      <div class="section-title">Guide de correction</div>
      <div class="field">
        <label>Type</label>
        <select id="guide-type" onchange="updateGuideUI()">
          <option value="texte">Texte</option>
          <option value="grille">Tableau (grille visuelle)</option>
        </select>
      </div>
      <div id="guide-extra">
        <div class="field"><textarea id="guide-texte" rows="3" placeholder="Réponse attendue…"></textarea></div>
      </div>
    </div>

<div id="toast"></div>

<script>
// ── TOKEN ─────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', init);

function utf8b64(str) {
  const bytes = new TextEncoder().encode(str);
  const CHUNK = 8192;
  let binary = '';
  for (let i = 0; i < bytes.length; i += CHUNK)
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  return btoa(binary);
}

// Normalise pour la recherche : minuscules + suppression des accents (é → e)
function fold(s) {
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

let formDirty = false;
window.addEventListener('beforeunload', e => { if(formDirty) { e.preventDefault(); e.returnValue = ''; } });

function saveToken() {
  const val = document.getElementById('gh-token').value;
  const remember = document.getElementById('gh-remember').checked;
  if(remember) { localStorage.setItem('gh_token', val); sessionStorage.removeItem('gh_token'); }
  else { sessionStorage.setItem('gh_token', val); localStorage.removeItem('gh_token'); }
  document.getElementById('token-status').textContent = '';
}
function getToken() { return document.getElementById('gh-token').value || localStorage.getItem('gh_token') || sessionStorage.getItem('gh_token') || ''; }

// ── INIT ──────────────────────────────────────────────────────────────
const OWNER = 'sbergeronencp002';
const REPO  = 'hqccssbf';
const BRANCH = 'main';

function updatePeriodes() {
  const niveau = document.getElementById('q-niveau').value;
  const periodes = PERIODES_PAR_NIVEAU[niveau] || [];
  const sel = document.getElementById('q-periode');
  sel.innerHTML = periodes.map(p => `<option value="${p}">${p}</option>`).join('');
  updateAspects();
}

function updateAspects() {
  const periode = document.getElementById('q-periode').value;
  const aspects = ASPECTS_PAR_PERIODE[periode] || [];
  const wrap = document.getElementById('aspects-list');
  wrap.innerHTML = aspects.map(a =>
    `<label style="display:flex;align-items:center;gap:.5rem;font-size:.83rem;cursor:pointer">
      <input type="checkbox" value="${a}" style="width:auto;cursor:pointer"> ${a}
    </label>`
  ).join('');
}

// Dérivé de la source unique OI_CONFIG (oi-config.js).
const SOUSTAG_MAP = {};
OI_LIST.forEach(oi => { if(OI_CONFIG[oi].soustags) SOUSTAG_MAP[oi] = OI_CONFIG[oi].soustags; });

function updateSoustag() {
  const oi = document.getElementById('q-oi')?.value || '';
  const row = document.getElementById('soustag-row');
  if(!row) return;
  const options = SOUSTAG_MAP[oi];
  if(!options) {
    row.style.display = 'none';
    document.querySelectorAll('input[name="q-soustag"]').forEach(r => r.checked = false);
    return;
  }
  const pills = document.getElementById('soustag-pills');
  pills.innerHTML = options.map(v =>
    `<label class="soustag-pill"><input type="radio" name="q-soustag" value="${v}"> ${v}</label>`
  ).join('') + `<label class="soustag-pill"><input type="radio" name="q-soustag" value=""> Aucun</label>`;
  row.style.display = '';
}

function getSoustag() {
  const checked = document.querySelector('input[name="q-soustag"]:checked');
  return checked ? checked.value : '';
}

function setSoustag(val) {
  document.querySelectorAll('input[name="q-soustag"]').forEach(r => {
    r.checked = (r.value === (val || ''));
  });
}

// Dérivé de la source unique OI_CONFIG (oi-config.js).
const OI_AUTO_REPONSE = {};
OI_LIST.forEach(oi => { if(OI_CONFIG[oi].autoReponse) OI_AUTO_REPONSE[oi] = OI_CONFIG[oi].autoReponse; });

function autoReponseFromOI() {
  const oi = document.getElementById('q-oi')?.value || '';
  const auto = OI_AUTO_REPONSE[oi];
  if(!auto) return;
  const repSel = document.getElementById('rep-type');
  if(!repSel) return;
  repSel.value = auto.type;
  updateReponseUI();
  if(auto.type === 'lignes') {
    const nb = document.getElementById('rep-nombre');
    if(nb) nb.value = String(auto.nombre);
  }
}

function updatePresets() {
  const oi = document.getElementById('q-oi').value;
  const presets = REGLETTES_PRESET[oi] || [];
  const sel = document.getElementById('reg-preset');
  sel.innerHTML = '<option value="">— Sélectionner —</option>'
    + presets.map((p,i) => `<option value="${i}">${p.label}</option>`).join('');
}

// ── MODE ÉDITION ──────────────────────────────────────────────────────
let editingId = null;

function setMode(mode) {
  const wrap = document.getElementById('edit-select-wrap');
  if(mode === 'edit') {
    wrap.style.display = '';
    populateEditSearch();
  } else {
    wrap.style.display = 'none';
    editingId = null;
    const nums = currentQuestions.map(q => parseInt(q.id.replace(/\D/g,''))).filter(n=>!isNaN(n));
    const nextId = nums.length ? 'Q' + (Math.max(...nums)+1) : 'Q1';
    document.getElementById('q-id').value = nextId;
    document.getElementById('next-id-badge').textContent = nextId;
    resetForm(true);
  }
}

function populateEditSearch() {
  // Remplir le filtre OI
  const ois = [...new Set(currentQuestions.map(q => q.oi))].sort((a,b) => a.localeCompare(b,'fr'));
  const selOi = document.getElementById('edit-filter-oi');
  const prevOi = selOi.value;
  selOi.innerHTML = '<option value="">Toutes les OI</option>'
    + ois.map(oi => `<option value="${oi}">${oi}</option>`).join('');
  if(prevOi) selOi.value = prevOi;
  filterEditList();
}

let editFocusIdx = -1;
let editFilteredResults = [];
let _adminSearchTimer = 0;
function debouncedFilterEditList() {
  clearTimeout(_adminSearchTimer);
  _adminSearchTimer = setTimeout(filterEditList, 260);
}

const ADMIN_PAGE = 100; // max cards rendues à la fois

function filterEditList() {
  const search  = fold((document.getElementById('edit-search')?.value || '').trim());
  const niveau  = document.getElementById('edit-filter-niveau')?.value || '';
  const oi      = document.getElementById('edit-filter-oi')?.value || '';
  // Pré-construire l'index de recherche à la volée (currentQuestions peut changer)
  editFilteredResults = currentQuestions.filter(q => {
    if(niveau && String(q.niveau) !== niveau) return false;
    if(oi     && q.oi !== oi) return false;
    if(search) {
      const hay = fold([q.id, q.oi, q.periode, q.enonce||'', ...(q.aspects||[]).map(a=>a.aspect)].join(' '));
      if(!hay.includes(search)) return false;
    }
    return true;
  });
  const results = editFilteredResults;

  editFocusIdx = results.findIndex(q => q.id === editingId);

  const countEl = document.getElementById('edit-results-count');
  if(countEl) countEl.textContent = results.length
    ? `${results.length} question${results.length > 1 ? 's' : ''} trouvée${results.length > 1 ? 's' : ''}`
    : '';

  const container = document.getElementById('edit-results');
  if(!results.length) {
    container.innerHTML = '<div class="edit-results-empty">Aucune question trouvée.</div>';
    return;
  }

  function highlight(text, term) {
    if(!term) return escHtml(text);
    const idx = text.toLowerCase().indexOf(term);
    if(idx < 0) return escHtml(text);
    return escHtml(text.slice(0, idx))
      + '<mark style="background:#fff3b0;border-radius:2px">' + escHtml(text.slice(idx, idx + term.length)) + '</mark>'
      + escHtml(text.slice(idx + term.length));
  }

  const visible = results.slice(0, ADMIN_PAGE);
  const remaining = results.length - ADMIN_PAGE;
  container.innerHTML = visible.map((q, i) => {
    const aspects = (q.aspects||[]).map(a => a.aspect).join(' · ');
    const noG = !q.guide;
    const isSelected = q.id === editingId;
    const isFocused  = i === editFocusIdx;
    const enonce = (q.enonce||'').replace(/\*\*/g,'').slice(0, 90) + ((q.enonce||'').length > 90 ? '…' : '');
    return `<div class="edit-result-card${isSelected ? ' selected' : ''}${isFocused ? ' focused' : ''}"
      data-idx="${i}" data-id="${q.id}" onclick="loadQuestion('${q.id}')" onmouseenter="editFocusIdx=${i}">
      <div style="min-width:0;flex:1">
        <div class="edit-card-meta">
          ${noG ? '<span class="edit-card-warn">⚠ </span>' : ''}<span class="edit-card-id">${highlight(q.id, search)}</span>
          &nbsp;—&nbsp;${highlight(q.oi, search)}
        </div>
        <div class="edit-card-enonce">${highlight(enonce, search)}</div>
        <div class="edit-card-sub">Niv.${q.niveau} · ${highlight(q.periode, search)} · ${highlight(aspects, search)}</div>
      </div>
    </div>`;
  }).join('');
  if(remaining > 0) {
    container.insertAdjacentHTML('beforeend',
      `<div style="padding:8px 12px;font-size:0.78rem;color:var(--ink-3);text-align:center;border-top:1px solid var(--border)">
        + ${remaining} autre${remaining>1?'s':''} — affinez la recherche pour les voir
      </div>`);
  }

  // Scroll la carte sélectionnée dans la vue
  const sel = container.querySelector('.selected');
  if(sel) sel.scrollIntoView({ block: 'nearest' });
}

function editKeyNav(e) {
  const cards = [...document.querySelectorAll('#edit-results .edit-result-card')];
  if(!cards.length) return;
  if(e.key === 'ArrowDown') { e.preventDefault(); editFocusIdx = Math.min(editFocusIdx + 1, cards.length - 1); }
  else if(e.key === 'ArrowUp') { e.preventDefault(); editFocusIdx = Math.max(editFocusIdx - 1, 0); }
  else if(e.key === 'Enter' && editFocusIdx >= 0) { e.preventDefault(); loadQuestion(editFilteredResults[editFocusIdx]?.id); return; }
  else return;
  cards.forEach((c, i) => c.classList.toggle('focused', i === editFocusIdx));
  cards[editFocusIdx]?.scrollIntoView({ block: 'nearest' });
}

function dupliquerQuestion() {
  if(!editingId) return;
  // Génère un nouvel ID
  const nums = currentQuestions.map(q => parseInt(q.id.replace(/\D/g,''))).filter(n=>!isNaN(n));
  const newId = 'Q' + (nums.length ? Math.max(...nums) + 1 : 1);
  // Bascule en mode "nouvelle question" sans effacer le formulaire
  editingId = null;
  document.querySelector('input[name="mode"][value="new"]').checked = true;
  document.getElementById('edit-select-wrap').style.display = 'none';
  document.getElementById('btn-supprimer').disabled = true;
  document.getElementById('btn-dupliquer').disabled = true;
  document.getElementById('q-id').value = newId;
  document.getElementById('next-id-badge').textContent = newId;
  toast('Formulaire dupliqué — modifie puis publie comme nouvelle question.', 'ok');
}

function loadQuestion(id) {
  const btnSuppr = document.getElementById('btn-supprimer');
  const btnDupl  = document.getElementById('btn-dupliquer');
  const selBar   = document.getElementById('edit-selected-bar');
  if(!id) {
    editingId = null;
    if(btnSuppr) btnSuppr.disabled = true;
    if(btnDupl)  btnDupl.disabled  = true;
    if(selBar)   selBar.style.display = 'none';
    return;
  }
  const q = currentQuestions.find(x => x.id === id);
  const r = currentReglettes[id];
  if(!q) return;
  editingId = id;
  if(btnSuppr) btnSuppr.disabled = false;
  if(btnDupl)  btnDupl.disabled  = false;

  // Mettre à jour la barre de sélection et la liste
  if(selBar) {
    selBar.style.display = '';
    const aspects = (q.aspects||[]).map(a=>a.aspect).join(' · ');
    document.getElementById('edit-selected-label').textContent =
      `${q.id} — ${q.oi} · Niv.${q.niveau} · ${q.periode}`;
  }
  // Mettre à jour la sélection visuellement sans re-rendre toute la liste
  document.querySelectorAll('#edit-results .edit-result-card').forEach(el => {
    el.classList.toggle('selected', el.dataset.id === id);
  });

  document.getElementById('q-id').value = q.id;
  document.getElementById('next-id-badge').textContent = q.id;
  document.getElementById('q-niveau').value = String(q.niveau);
  updatePeriodes();
  document.getElementById('q-periode').value = q.periode;
  updateAspects();
  const aspectValues = new Set((q.aspects||[]).map(a=>a.aspect));
  document.querySelectorAll('#aspects-list input[type=checkbox]').forEach(cb => { cb.checked = aspectValues.has(cb.value); });
  document.getElementById('q-oi').value = q.oi;
  updatePresets();
  updateSoustag();
  setSoustag(q.soustag || '');
  document.getElementById('q-enonce').value = q.enonce || '';

  document.getElementById('docs-list').innerHTML = '';
  docCount = 0; colCount = 0;
  (q.documents||[]).forEach(d => {
    if(d.type==='textes' && d.cols) {
      if(d.cols.length===1) {
        const col = d.cols[0];
        if(col.ref) {
          addDoc('image');
          document.getElementById('doc-'+docCount+'-titre').value = col.titre||'';
          const stEl2 = document.getElementById('doc-'+docCount+'-soustitre');
          if(stEl2) stEl2.value = col.soustitre||'';
          const s = document.getElementById('doc-'+docCount+'-ref');
          if(s) s.value = col.ref;
          const autEl2 = document.getElementById('doc-'+docCount+'-auteur');
          if(autEl2) autEl2.value = col.auteur||'';
          const srcEl2 = document.getElementById('doc-'+docCount+'-source');
          if(srcEl2) srcEl2.value = col.source||'';
        } else {
          addDoc('textes');
          document.getElementById('doc-'+docCount+'-titre').value = col.titre||'';
          const stEl = document.getElementById('doc-'+docCount+'-soustitre');
          if(stEl) stEl.value = col.soustitre||'';
          document.getElementById('doc-'+docCount+'-texte').value = col.texte||'';
          const autEl = document.getElementById('doc-'+docCount+'-auteur');
          if(autEl) autEl.value = col.auteur||'';
          const srcEl = document.getElementById('doc-'+docCount+'-source');
          if(srcEl) srcEl.value = col.source||'';
        }
      } else {
        addDoc('textes-image');
        const docId = docCount;
        d.cols.forEach(col => {
          if(col.ref) {
            addCol(docId,'image');
            document.getElementById('col-'+colCount+'-titre').value = col.titre||'';
            const stElC2 = document.getElementById('col-'+colCount+'-soustitre');
            if(stElC2) stElC2.value = col.soustitre||'';
            const s = document.getElementById('col-'+colCount+'-ref');
            if(s) s.value = col.ref;
            const autElC = document.getElementById('col-'+colCount+'-auteur');
            if(autElC) autElC.value = col.auteur||'';
            const srcElC = document.getElementById('col-'+colCount+'-source');
            if(srcElC) srcElC.value = col.source||'';
          } else {
            addCol(docId,'texte');
            document.getElementById('col-'+colCount+'-titre').value = col.titre||'';
            const stElC = document.getElementById('col-'+colCount+'-soustitre');
            if(stElC) stElC.value = col.soustitre||'';
            document.getElementById('col-'+colCount+'-texte').value = col.texte||'';
            const autEl = document.getElementById('col-'+colCount+'-auteur');
            if(autEl) autEl.value = col.auteur||'';
            const srcEl = document.getElementById('col-'+colCount+'-source');
            if(srcEl) srcEl.value = col.source||'';
          }
        });
      }
    }
  });

  const repType = q.reponse ? (q.reponse===true?'none':q.reponse.type) : 'none';
  const repSel = document.getElementById('rep-type');
  // Garde-fou : si la question utilise un type de réponse de format hérité
  // (retiré du menu, ex. tableau_3col / tableau), on injecte une option à la
  // volée pour que la valeur tienne et soit réécrite telle quelle à la sauvegarde
  // (sinon le <select> retomberait sur « Aucune » et la réponse serait perdue).
  if(repType && ![...repSel.options].some(o => o.value === repType)) {
    const o = document.createElement('option');
    o.value = repType; o.textContent = repType + ' (format hérité)';
    repSel.appendChild(o);
  }
  repSel.value = repType;
  updateReponseUI();
  if(repType==='lignes') document.getElementById('rep-nombre').value = q.reponse.nombre||2;
  else if(repType==='image') { const s=document.getElementById('rep-ref'); if(s) s.value=q.reponse.ref||''; }
  else if(repType==='tableau_3col') {
    const c1=document.getElementById('rep-col1'); if(c1) c1.value=q.reponse.col1||'';
    const c2=document.getElementById('rep-col2'); if(c2) c2.value=q.reponse.col2||'';
    const c3=document.getElementById('rep-col3'); if(c3) c3.value=q.reponse.col3||'';
  }
  else if(repType==='tableau') document.getElementById('rep-lignes').value = (q.reponse.lignes||[]).map(l=>l.label).join('\n');
  else if(repType==='grille') {
    document.getElementById('rep-cols').value = String(Math.max(2,(q.reponse.entetes||[]).length));
    document.getElementById('rep-rows').value = String(Math.max(1,(q.reponse.rangees||[]).length));
    updateRepGrille(q.reponse);
  }
  else if(repType==='avant-apres') {
    const lbl = document.getElementById('rep-avant-apres-label');
    if(lbl) lbl.value = q.reponse.label || '';
  }
  else if(repType==='mettre-en-relation') {
    const els = q.reponse.elements || [];
    const nSel = document.getElementById('rep-mer-n');
    if(nSel) { nSel.value = String(els.length || 2); updateReponseUI(); }
    const dbl = document.getElementById('rep-mer-double');
    if(dbl) { dbl.checked = !!q.reponse.double; updateReponseUI(); }
    els.forEach((v, i) => {
      const el = document.getElementById('rep-mer-el-' + i);
      if(el) el.value = v;
    });
  }
  else if(repType==='situer-dans-lespace') {
    const els = q.reponse.elements || [];
    els.forEach((v, i) => {
      const el = document.getElementById('rep-sde-el-' + i);
      if(el) el.value = v;
    });
  }

  if(r) {
    const rOi = r.oi || q.oi;
    const presets = REGLETTES_PRESET[rOi] || [];
    let matchIdx = -1;
    if(r.variante) {
      matchIdx = presets.findIndex(p => p.variante === r.variante);
    } else {
      matchIdx = presets.findIndex(p => !p.variante && p.niveaux?.[0]?.desc === r.niveaux?.[0]?.desc);
    }
    if(matchIdx !== -1) document.getElementById('reg-preset').value = String(matchIdx);
  }

  if(q.guide && typeof q.guide==='string') {
    document.getElementById('guide-type').value='texte'; updateGuideUI();
    document.getElementById('guide-texte').value = q.guide;
  } else if(q.guide && q.guide.type==='grille') {
    document.getElementById('guide-type').value='grille'; updateGuideUI();
    document.getElementById('guide-cols').value = String(Math.max(2,(q.guide.entetes||[]).length));
    document.getElementById('guide-rows').value = String(Math.max(1,(q.guide.rangees||[]).length));
    updateGrille(q.guide);
  } else if(q.guide && q.guide.type==='tableau') {
    // Conversion automatique ancien format → grille
    document.getElementById('guide-type').value='grille'; updateGuideUI();
    const converted = { entetes:['Élément','Document'], rangees:(q.guide.lignes||[]).map(l=>[l.label,l.valeur]) };
    document.getElementById('guide-cols').value='2';
    document.getElementById('guide-rows').value = String(Math.max(1,converted.rangees.length));
    updateGrille(converted);
  } else {
    document.getElementById('guide-type').value='grille'; updateGuideUI();
  }
  formDirty = false;
}

// ── SUPPRIMER QUESTION ────────────────────────────────────────────────
// Lit questions.js via l'API Contents (avec fallback download_url si > 1 Mo).
// Retourne { sha, content (texte JS brut) }.
async function _fetchQuestionsRaw(headers) {
  const r = await fetch(
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/questions.js?ref=${BRANCH}&t=${Date.now()}`,
    { headers, cache: 'no-store' }
  );
  if(!r.ok) throw new Error('Impossible de lire questions.js : ' + r.status);
  const data = await r.json();
  const sha = data.sha;
  let content;
  if(data.content) {
    // Fichier ≤ 1 Mo : contenu inline base64
    const rawB64 = data.content.replace(/\n/g,'');
    const binary = atob(rawB64);
    const bytes = new Uint8Array(binary.length);
    for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    content = new TextDecoder('utf-8').decode(bytes);
  } else if(data.download_url) {
    // Fichier > 1 Mo : téléchargement direct
    const raw = await fetch(data.download_url + '&t=' + Date.now(), { cache: 'no-store' });
    if(!raw.ok) throw new Error('Impossible de télécharger questions.js : ' + raw.status);
    content = await raw.text();
  } else {
    throw new Error("Réponse inattendue de l'API GitHub pour questions.js");
  }
  return { sha, content };
}

async function fetchFreshState(token) {
  const { sha, content } = await _fetchQuestionsRaw({ Authorization: `token ${token}` });
  questionsFileSha = sha;
  let result;
  try {
    const fn = new Function(content + '\nreturn { REGLETTES, IMAGE_DB, QUESTIONS };');
    result = fn();
  } catch(e) {
    throw new Error('questions.js est invalide ou corrompu : ' + e.message);
  }
  currentQuestions = result.QUESTIONS;
  currentReglettes = result.REGLETTES;
  currentImageDb   = result.IMAGE_DB;
  return result;
}

async function supprimerQuestion() {
  if(!editingId) return;
  if(!confirm(`Supprimer ${editingId} ? (les autres questions conservent leur identifiant)`)) return;
  const token = getToken();
  if(!token) { toast('Saisis ton token GitHub.', 'err'); return; }

  const btn = document.getElementById('btn-supprimer');
  btn.disabled = true; btn.textContent = '⏳ Suppression…';

  try {
    const idSupp = editingId;

    // Reload full content from GitHub before modifying
    await fetchFreshState(token);

    // Retirer la question et sa réglette (IDs stables : pas de renumérotation,
    // pour ne pas casser les paniers enregistrés ni les cahiers déjà imprimés)
    currentQuestions = currentQuestions.filter(q => q.id !== idSupp);
    delete currentReglettes[idSupp];

    const newContent = generateQuestionsJs(currentQuestions, currentReglettes, currentImageDb);
    const encoded = utf8b64(newContent);

    const putResp = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/questions.js`, {
      method: 'PUT',
      headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `Supprimer ${idSupp}`,
        content: encoded, sha: questionsFileSha, branch: BRANCH
      })
    });
    if(!putResp.ok) {
      let m = putResp.status;
      try { const e = await putResp.json(); m = e.message || m; } catch(_) {}
      if(putResp.status === 409 || String(m).toLowerCase().includes('fast forward') || String(m).toLowerCase().includes('conflict'))
        throw new Error('Conflit : un·e collègue a publié en même temps. Rechargez la page (F5) et réessayez.');
      throw new Error(m);
    }

    const result = await putResp.json();
    questionsFileSha = result.content.sha;

    document.getElementById('edit-selected-bar').style.display = 'none';
    populateEditSearch();
    resetForm(false);
    const delNums = currentQuestions.map(q => parseInt(q.id.replace(/\D/g,''))).filter(n=>!isNaN(n));
    const nextId = 'Q' + (delNums.length ? Math.max(...delNums)+1 : 1);

async function uploadImage() {
  const token = getToken();
  if(!token) { toast('Saisis ton token GitHub.', 'err'); return; }
  const file = document.getElementById('upload-file').files[0];
  if(!file) { toast('Sélectionne un fichier image.', 'err'); return; }
  // Nom de base SANS extension : l'extension finale dépend du format choisi plus bas.
  const baseName = (document.getElementById('upload-name').value.trim() || file.name)
    .replace(/\.(png|jpe?g|webp|gif)$/i, '')
    .replace(/\s+/g,'_').replace(/[\\'"`<>&]/g,'');   // pas d'espaces, quotes, antislash ni <>& (cassent onclick/attributs/HTML)
  const statusEl = document.getElementById('upload-status');
  const btn = document.getElementById('btn-upload');
  btn.disabled = true; statusEl.textContent = '⏳ Téléversement…';
  try {
    // Redimensionne (max 1200 px) puis choisit le format le plus léger sans perte visible :
    //  • transparence détectée → PNG obligatoire ;
    //  • sinon → on compare PNG vs JPEG 0.85 et on garde le plus petit. Les photos/scans
    //    pèsent ~5× moins en JPEG (c'était la cause des images à 2,5 Mo) ; les aplats et
    //    graphiques restent en PNG s'il est plus avantageux.
    const imgInfo = await new Promise((res,rej) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const MAX = 1200;
          const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.round(img.naturalWidth * scale);
          const h = Math.round(img.naturalHeight * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          let hasAlpha = false;
          try {
            const data = ctx.getImageData(0, 0, w, h).data;
            for(let i = 3; i < data.length; i += 4) { if(data[i] < 255) { hasAlpha = true; break; } }
          } catch(_) { hasAlpha = true; }   // canvas inaccessible → on reste prudent en PNG
          const pngB64 = canvas.toDataURL('image/png').split(',')[1];
          let b64 = pngB64, ext = 'png';
          if(!hasAlpha) {
            const jpgB64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
            if(jpgB64.length < pngB64.length) { b64 = jpgB64; ext = 'jpg'; }
          }
          res({ b64, w, h, ext });
        };
        img.onerror = rej;
        img.src = e.target.result;
      };
      reader.onerror = rej;
      reader.readAsDataURL(file);
    });
    const name = baseName + '.' + imgInfo.ext;
    // SHA d'un éventuel fichier existant de même nom (pour l'écraser proprement).
    const existingSha = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/images/${name}?ref=${BRANCH}&t=${Date.now()}`, { headers:{ Authorization:`token ${token}` } })
      .then(r => r.ok ? r.json().then(d => d.sha || '') : '').catch(() => '');
    const putResp = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/images/${name}`, {
      method:'PUT',
      headers:{ Authorization:`token ${token}`, 'Content-Type':'application/json' },
      body: JSON.stringify({ message:`Ajouter image : ${name}`, content:imgInfo.b64, branch:BRANCH, ...(existingSha ? { sha: existingSha } : {}) })
    });
    if(!putResp.ok) { const err=await putResp.json(); throw new Error(err.message||putResp.status); }
    currentImageDb[name] = { src: 'images/' + name, w: imgInfo.w, h: imgInfo.h };
    const ko = Math.round(imgInfo.b64.length * 3 / 4 / 1024);
    statusEl.textContent = `✓ ${name} téléversé (${ko} Ko) !`;
    if(ko > 500) toast(`⚠ ${name} fait ${ko} Ko même après compression. Réduis la résolution de l'image source si possible.`, 'err');
    document.getElementById('upload-file').value='';
    document.getElementById('upload-name').value='';
    if (!IMAGES.includes(name)) { IMAGES.push(name); IMAGES.sort(); }
    addRecentImage(name);
    const opts = buildImageOptions();
    document.querySelectorAll('select[id$="-ref"]').forEach(sel => { const v=sel.value; sel.innerHTML=opts; sel.value=v; });
    toast(`"${name}" ajouté aux images.`, 'ok');
  } catch(e) {
    statusEl.textContent = '✗ ' + e.message;
    toast('Erreur : ' + e.message, 'err');
  } finally { btn.disabled = false; }
}

let IMAGES = [];
let RECENT_IMAGES = [];
let currentQuestions = [];
let currentReglettes = {};
let currentImageDb = {};
let questionsFileSha = '';

async function loadRecentImages() {
  try { RECENT_IMAGES = JSON.parse(localStorage.getItem('hqc_recent_images') || '[]'); } catch(_) { RECENT_IMAGES = []; }
  if(!getToken()) return;
  try {
    const r = await fetch(
      `https://api.github.com/repos/${OWNER}/${REPO}/commits?path=images&per_page=15&ref=${BRANCH}`,
      { headers: { Authorization: `token ${getToken()}` }, cache: 'no-store' }
    );
    if(!r.ok) return;
    const commits = await r.json();
    const seen = [];
    for(const c of commits) {
      const m = (c.commit?.message || '').match(/^Ajouter image\s*:\s*(.+)/m);
      if(m) { const name = m[1].trim(); if(!seen.includes(name)) seen.push(name); }
      if(seen.length >= 3) break;
    }
    if(seen.length) {
      RECENT_IMAGES = seen;
      try { localStorage.setItem('hqc_recent_images', JSON.stringify(RECENT_IMAGES)); } catch(_) {}
    }
  } catch(_) {}
}
function addRecentImage(name) {
  RECENT_IMAGES = [name, ...RECENT_IMAGES.filter(x => x !== name)].slice(0, 3);
  try { localStorage.setItem('hqc_recent_images', JSON.stringify(RECENT_IMAGES)); } catch(_) {}
}
function buildImageOptions() {
  const recent = RECENT_IMAGES.filter(r => IMAGES.includes(r)).sort((a,b) => a.localeCompare(b,'fr'));
  const rest = IMAGES.filter(i => !recent.includes(i));
  let opts = '<option value="">— Choisir une image —</option>';
  if(recent.length) {
    opts += recent.map(f => `<option value="${escHtml(f)}">⭐ ${escHtml(f)}</option>`).join('');
    opts += '<option value="" disabled>──────────────────</option>';
  }
  return opts + rest.map(f => `<option value="${escHtml(f)}">${escHtml(f)}</option>`).join('');
}

async function loadImages() {
  let sansToken = false;
  for(let tentative = 0; tentative < 3; tentative++) {
    try {
      const headers = (getToken() && !sansToken) ? { Authorization: `token ${getToken()}` } : {};
      const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/images?ref=${BRANCH}&t=${Date.now()}`, { headers, cache: 'no-store' });
      if((r.status === 401 || r.status === 403) && !sansToken) {
        // Token expiré ou invalide : le dépôt est public, on réessaie en lecture anonyme
        sansToken = true;
        toast('Token GitHub invalide ou expiré — régénérez-le sur github.com/settings/tokens puis recollez-le dans le champ ci-dessus.', 'err');
        continue;
      }
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      if(!Array.isArray(data)) throw new Error('Réponse inattendue de l’API GitHub');
      IMAGES = data.filter(f => f.name !== '.gitkeep').map(f => f.name).sort();
      refreshImageSelects();
      return;
    } catch(e) {
      if(tentative < 2) await new Promise(res => setTimeout(res, 1200 * (tentative + 1)));
    }
  }
  // Mode secours : liste reconstruite depuis IMAGE_DB (questions.js)
  const secours = Object.keys(currentImageDb || {}).sort();
  if(secours.length) {
    IMAGES = secours;
    refreshImageSelects();
    toast('Liste d’images chargée en mode secours depuis questions.js — vérifiez le token GitHub.', 'err');
  } else {
    toast('Impossible de charger la liste des images — vérifiez la connexion et le token GitHub.', 'err');
  }
}

async function loadQuestionsJs() {
  try {
    let tokenKo = false;
    let sha, content;
    try {
      const headers = getToken() ? { Authorization: `token ${getToken()}` } : {};
      ({ sha, content } = await _fetchQuestionsRaw(headers));
    } catch(e) {
      // 401/403 → on relit en anonyme (dépôt public)
      if(/401|403/.test(e.message)) {
        tokenKo = true;
        document.getElementById('token-status').textContent = '✗ Token invalide ou expiré';
        document.getElementById('token-status').className = 'token-status ko';
        ({ sha, content } = await _fetchQuestionsRaw({}));
      } else {
        throw e;
      }
    }
    questionsFileSha = sha;
    let result;
    try {
      const fn = new Function(content + '\n return { REGLETTES, IMAGE_DB, QUESTIONS };');
      result = fn();
    } catch(e) {
      throw new Error('questions.js est invalide ou corrompu : ' + e.message);
    }
    currentQuestions = result.QUESTIONS;
    currentReglettes = result.REGLETTES;
    currentImageDb   = result.IMAGE_DB;
    // Next ID
    const nums = currentQuestions.map(q => parseInt(q.id.replace(/\D/g,''))).filter(n=>!isNaN(n));
    const nextNum = nums.length ? Math.max(...nums) + 1 : 1;
    const nextId = 'Q' + nextNum;
    document.getElementById('q-id').value = nextId;
    document.getElementById('next-id-badge').textContent = nextId;
    if(!tokenKo) {
      document.getElementById('token-status').textContent = '✓ Connecté';
      document.getElementById('token-status').className = 'token-status ok';
    }
    renderDashboard();
  } catch(e) {
    document.getElementById('token-status').textContent = '✗ Erreur de connexion';
    document.getElementById('token-status').className = 'token-status ko';
  }
}

async function loadReglettesJs() {
  try {
    const headers = getToken() ? { Authorization: `token ${getToken()}` } : {};
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/reglettes.js?ref=${BRANCH}&t=${Date.now()}`, { headers, cache: 'no-store' });
    if(!r.ok) return;
    const data = await r.json();
    const binary = atob(data.content.replace(/\n/g,''));
    const bytes = new Uint8Array(binary.length);
    for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const content = new TextDecoder('utf-8').decode(bytes);
    const fn = new Function(content + '\nreturn REGLETTES_PRESET;');
    const fresh = fn();
    for(const k in REGLETTES_PRESET) delete REGLETTES_PRESET[k];
    Object.assign(REGLETTES_PRESET, fresh);
    updatePresets();
  } catch(e) { /* utilise la version statique */ }
}

    let fields = `<div style="display:flex;align-items:center;gap:1.2rem;margin-bottom:.75rem;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:.6rem">
        <label style="font-size:.75rem;font-weight:600;color:var(--ink-2)">Nombre d'éléments</label>
        ${sel('rep-mer-n',[2,3,4],n)}
      </div>`;
    if(n === 2) {
      fields += `<label style="display:flex;align-items:center;gap:.4rem;font-size:.78rem;cursor:pointer">
        <input type="checkbox" id="rep-mer-double" onchange="updateReponseUI()"${doubleCirc?' checked':''}> Deux cercles (avec et)
      </label>`;
    }
    fields += `</div><div style="display:grid;grid-template-columns:repeat(${n},1fr);gap:.5rem">`;
    for(let i = 0; i < n; i++) {
      const ex = (MER_EX[n] || [])[i] || 'Élément ' + (i+1);
      fields += `<div class="field" style="margin:0"><label style="font-size:.72rem">Élément ${i+1}</label><input type="text" id="rep-mer-el-${i}" placeholder="ex. : ${ex}" oninput="syncGuideFromMer(false)"></div>`;
    }
    fields += '</div>';
    wrap.innerHTML = fields;
  } else if(type === 'situer-dans-lespace') {
    const SDE_EX = ['Nouvelle-France', 'Treize colonies'];
    let fields = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem">`;
    for(let i = 0; i < 2; i++) {
      fields += `<div class="field" style="margin:0"><label style="font-size:.72rem">Élément ${i+1}</label><input type="text" id="rep-sde-el-${i}" placeholder="ex. : ${SDE_EX[i]}"></div>`;
    }
    fields += '</div>';
    wrap.innerHTML = fields;
  } else if(type === 'cause-consequence') {
    wrap.innerHTML = `<div class="field" style="color:var(--ink-3);font-size:.82rem">Tableau fixe : Cause et Conséquence avec cercle de réponse (1,25 cm).</div>`;
  } else {
    wrap.innerHTML = '';
  }

  // Guide « miroir » pour Mettre en relation : on bascule le guide en grille
  // reprenant les éléments en en-têtes + une rangée pour la lettre du document.
  const merJustOpened = (type === 'mettre-en-relation' && _prevRepType !== 'mettre-en-relation');
  if(type === 'mettre-en-relation') syncGuideFromMer(merJustOpened);
  _prevRepType = type;
}

// Reprend les éléments de la réponse « Mettre en relation » dans le guide,
// sous forme de grille : en-têtes = éléments, une rangée vide pour les lettres.
// forceCreate = true → bascule le guide en grille (à l'ouverture du type MER) ;
// sinon, resynchronise seulement si le guide est déjà une grille (respecte un
// guide « Texte » choisi volontairement). Les lettres déjà saisies sont conservées.
function syncGuideFromMer(forceCreate) {
  if(document.getElementById('rep-type').value !== 'mettre-en-relation') return;
  const guideTypeSel = document.getElementById('guide-type');
  if(forceCreate) { guideTypeSel.value = 'grille'; updateGuideUI(); }
  if(guideTypeSel.value !== 'grille') return;
  const n = parseInt(document.getElementById('rep-mer-n')?.value || '2') || 2;
  const els = [];
  for(let i = 0; i < n; i++) {
    els.push((document.getElementById('rep-mer-el-' + i)?.value || '').trim() || ('Élément ' + (i + 1)));
  }
  const prevRow = (getGrilleValues().rangees || [])[0] || [];
  const row = Array.from({ length: n }, (_, i) => prevRow[i] || '');
  document.getElementById('guide-cols').value = String(n);
  document.getElementById('guide-rows').value = '1';
  updateGrille({ entetes: els, rangees: [row] });
}

function updateRepGrille(data) {
  const cols = parseInt(document.getElementById('rep-cols').value);
  const rows = parseInt(document.getElementById('rep-rows').value);
  const prev = data || getRepGrilleValues();
  let html = '<table class="guide-grille"><tr><td class="guide-grille-num"></td>';
  for(let c = 0; c < cols; c++) {
    const v = escHtml((prev.entetes && prev.entetes[c]) || '');
    html += `<th><input type="text" class="rep-grille-entete" placeholder="En-tête ${c+1}" value="${v}"></th>`;
  }
  html += '</tr>';
  for(let r = 0; r < rows; r++) {
    html += `<tr><td class="guide-grille-num">${r+1}</td>`;
    for(let c = 0; c < cols; c++) {
      const v = escHtml((prev.rangees && prev.rangees[r] && prev.rangees[r][c]) || '');
      html += `<td><input type="text" class="rep-grille-cell" placeholder="…" value="${v}"></td>`;
    }
    html += '</tr>';
  }
  html += '</table>';
  document.getElementById('rep-grille-wrap').innerHTML = html;
}

function getRepGrilleValues() {
  const entetes = [...document.querySelectorAll('.rep-grille-entete')].map(i => i.value);
  const rangees = [];
  document.querySelectorAll('#rep-grille-wrap tr').forEach((tr, idx) => {
    if(idx === 0) return;
    rangees.push([...tr.querySelectorAll('.rep-grille-cell')].map(i => i.value));
  });
  return { entetes, rangees };
}

// ── GUIDE ─────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateGuideUI() {
  const type = document.getElementById('guide-type').value;
  const wrap = document.getElementById('guide-extra');
  if(type === 'texte') {
    wrap.innerHTML = `<div class="field"><textarea id="guide-texte" rows="3" placeholder="Réponse attendue…"></textarea></div>`;
  } else {
    const sel = (id, vals, def) => `<select id="${id}" style="padding:.28rem .45rem;font-size:.82rem;border:1px solid var(--border);border-radius:4px;background:var(--paper)" onchange="updateGrille()">${vals.map(v=>`<option value="${v}"${v==def?' selected':''}>${v}</option>`).join('')}</select>`;
    wrap.innerHTML = `
      <div style="display:flex;gap:1.2rem;align-items:center;margin-bottom:.75rem;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:.4rem">
          <label style="font-size:.75rem;font-weight:600;color:var(--ink-2)">Colonnes</label>
          ${sel('guide-cols',[2,3,4],2)}
        </div>
        <div style="display:flex;align-items:center;gap:.4rem">
          <label style="font-size:.75rem;font-weight:600;color:var(--ink-2)">Rangées</label>
          ${sel('guide-rows',[1,2,3,4,5,6,7,8],2)}
        </div>
      </div>
      <div id="guide-grille-wrap"></div>`;

  }
}

function updateGrille(data) {
  const cols = parseInt(document.getElementById('guide-cols').value);
  const rows = parseInt(document.getElementById('guide-rows').value);
  const prev = data || getGrilleValues();
  let html = '<table class="guide-grille"><tr><td class="guide-grille-num"></td>';
  for(let c = 0; c < cols; c++) {

  }
  html += '</tr>';
  for(let r = 0; r < rows; r++) {
    html += `<tr><td class="guide-grille-num">${r+1}</td>`;

    }

function getGrilleValues() {
  const entetes = [...document.querySelectorAll('.guide-grille-entete')].map(i => i.value);

// ── BUILD QUESTION OBJECT ─────────────────────────────────────────────
function buildQuestion() {
  const id = document.getElementById('q-id').value.trim();
  const niveau = parseInt(document.getElementById('q-niveau').value);
  const oi = document.getElementById('q-oi').value;
  const periode = document.getElementById('q-periode').value;
  const enonce = document.getElementById('q-enonce').value.trim();
  const aspects = [...document.querySelectorAll('#aspects-list input[type=checkbox]:checked')]
    .map(cb => ({ aspect: cb.value }));
  const presetIdx = parseInt(document.getElementById('reg-preset').value);
  const presetOi = document.getElementById('q-oi').value;
  const preset = !isNaN(presetIdx) ? (REGLETTES_PRESET[presetOi] || [])[presetIdx] : null;
  let points = 2;
  if(preset) {
    if(preset.variante) points = 3;
    else if(preset.niveaux?.length) points = Math.max(...preset.niveaux.map(n => n.pts));
  }

  // Documents
  const documents = [];
  document.querySelectorAll('#docs-list > .block').forEach(docEl => {
    const dtype = docEl.dataset.type;
    if(dtype === 'textes') {
      const titre = docEl.querySelector('[id$="-titre"]')?.value.trim() || '';
      const soustitre = docEl.querySelector('[id$="-soustitre"]')?.value.trim() || '';
      const texte = docEl.querySelector('[id$="-texte"]')?.value.trim() || '';
      const auteur = docEl.querySelector('[id$="-auteur"]')?.value.trim() || '';
      const source = docEl.querySelector('[id$="-source"]')?.value.trim() || '';
      const col = { titre, texte };
      if(soustitre) col.soustitre = soustitre;
      if(auteur) col.auteur = auteur;
      if(source) col.source = source;
      documents.push({ type: 'textes', cols: [col] });
    } else if(dtype === 'image') {
      const titre = docEl.querySelector('[id$="-titre"]')?.value.trim() || '';
      const soustitre = docEl.querySelector('[id$="-soustitre"]')?.value.trim() || '';
      const ref = docEl.querySelector('[id$="-ref"]')?.value || '';
      const auteur = docEl.querySelector('[id$="-auteur"]')?.value.trim() || '';
      const source = docEl.querySelector('[id$="-source"]')?.value.trim() || '';
      const col = { titre, ref };
      if(soustitre) col.soustitre = soustitre;
      if(auteur) col.auteur = auteur;
      if(source) col.source = source;
      documents.push({ type: 'textes', cols: [col] });
    } else if(dtype === 'textes-image') {
      const cols = [];
      docEl.querySelectorAll('.col-block').forEach(colEl => {
        const ctype = colEl.dataset.type;
        const titre = colEl.querySelector('[id$="-titre"]')?.value.trim() || '';
        const soustitre = colEl.querySelector('[id$="-soustitre"]')?.value.trim() || '';
        if(ctype === 'texte') {
          const texte = colEl.querySelector('[id$="-texte"]')?.value.trim() || '';
          const auteur = colEl.querySelector('[id$="-auteur"]')?.value.trim() || '';
          const source = colEl.querySelector('[id$="-source"]')?.value.trim() || '';
          const col = { titre, texte };
          if(soustitre) col.soustitre = soustitre;
          if(auteur) col.auteur = auteur;
          if(source) col.source = source;
          cols.push(col);
        } else {
          const ref = colEl.querySelector('[id$="-ref"]')?.value || '';
          const auteurImg = colEl.querySelector('[id$="-auteur"]')?.value.trim() || '';
          const sourceImg = colEl.querySelector('[id$="-source"]')?.value.trim() || '';
          const col = { titre, ref };
          if(soustitre) col.soustitre = soustitre;
          if(auteurImg) col.auteur = auteurImg;
          if(sourceImg) col.source = sourceImg;
          cols.push(col);
        }
      });
      if(cols.length) documents.push({ type: 'textes', cols });
    }
  });

  // Réponse
  let reponse = false;
  const repType = document.getElementById('rep-type').value;
  if(repType === 'lignes') {
    reponse = { type: 'lignes', nombre: parseInt(document.getElementById('rep-nombre').value) };
  } else if(repType === 'image') {
    reponse = { type: 'image', ref: document.getElementById('rep-ref').value };
  } else if(repType === 'tableau_3col') {
    reponse = { type: 'tableau_3col',
      col1: document.getElementById('rep-col1').value.trim(),
      col2: document.getElementById('rep-col2').value.trim(),
      col3: document.getElementById('rep-col3').value.trim()
    };
  } else if(repType === 'tableau') {
    const lignes = document.getElementById('rep-lignes').value.trim().split('\n').map(s=>s.trim()).filter(Boolean).map(s=>({ label: s }));
    reponse = { type: 'tableau', lignes };
  } else if(repType === 'tableau_2col') {
    reponse = { type: 'tableau_2col' };
  } else if(repType === 'grille') {
    const { entetes, rangees } = getRepGrilleValues();
    const hasContent = entetes.some(e=>e.trim()) || rangees.some(r=>r.some(c=>c.trim()));
    if(hasContent) reponse = { type: 'grille', entetes, rangees };
  } else if(repType === 'avant-apres') {
    const eventLabel = document.getElementById('rep-avant-apres-label')?.value.trim() || '';
    reponse = { type: 'avant-apres', ...(eventLabel ? { label: eventLabel } : {}) };
  } else if(repType === 'cause-consequence') {
    reponse = { type: 'cause-consequence' };
  } else if(repType === 'situer-dans-lespace') {
    const elements = [0,1].map(i => (document.getElementById('rep-sde-el-' + i)?.value || '').trim());
    reponse = { type: 'situer-dans-lespace', elements };
  } else if(repType === 'mettre-en-relation') {
    const n = parseInt(document.getElementById('rep-mer-n')?.value || '2') || 2;
    const elements = [];
    for(let i = 0; i < n; i++) {
      elements.push((document.getElementById('rep-mer-el-' + i)?.value || '').trim());
    }
    const double = n === 2 && !!document.getElementById('rep-mer-double')?.checked;
    reponse = { type: 'mettre-en-relation', elements, ...(double ? { double: true } : {}) };
  }

  // Guide
  let guide = false;
  const guideType = document.getElementById('guide-type').value;
  if(guideType === 'texte') {
    guide = document.getElementById('guide-texte').value.trim() || false;
  } else {
    const { entetes, rangees } = getGrilleValues();
    const hasContent = entetes.some(e=>e.trim()) || rangees.some(r=>r.some(c=>c.trim()));
    if(hasContent) guide = { type:'grille', entetes, rangees };
  }

  const soustag = getSoustag();
  const updatedAt = new Date().toISOString();
  return { id, niveau, oi, periode, points, ...(soustag ? { soustag } : {}), enonce, aspects, documents, reponse, guide, updatedAt };
}

function buildReglette(id) {
  const oi = document.getElementById('q-oi').value;
  const idx = parseInt(document.getElementById('reg-preset').value);
  if(isNaN(idx)) return { oi, colonnes:[], niveaux:[] };
  const preset = (REGLETTES_PRESET[oi] || [])[idx];
  if(!preset) return { oi, colonnes:[], niveaux:[] };
  const { label, ...rest } = preset;
  return { oi, ...rest };
}
