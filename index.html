<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HQC · CSSBF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>HQC · CSSBF</h1>
  <span style="font-size:0.7rem;color:rgba(255,255,255,0.6);letter-spacing:0.12em;text-transform:uppercase;margin-left:12px">PROTOTYPE</span>
</header>

<div class="layout">
  <aside class="sidebar">
    <h2>Filtres</h2>

    <div class="filter-group">
      <label class="filter-label">Niveau</label>
      <select id="f-niveau" onchange="applyFilters()">
        <option value="">Tous</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </div>

    <div class="filter-group">
      <label class="filter-label">Période</label>
      <select id="f-periode" onchange="onPeriodeChange()">
        <option value="">Toutes</option>
      </select>
    </div>

    <div class="filter-group">
      <label class="filter-label">Aspect</label>
      <select id="f-aspect" onchange="applyFilters()">
        <option value="">Tous</option>
      </select>
    </div>

    <div class="filter-group">
      <label class="filter-label">Opération intellectuelle</label>
      <select id="f-oi" onchange="applyFilters()">
        <option value="">Toutes</option>
      </select>
    </div>

    <button class="reset-btn" onclick="resetFilters()">↺ Réinitialiser les filtres</button>

    <div class="stats" style="margin-top:2rem">
      <span class="stat-num" id="stat-num">0</span>
      question(s) affichée(s)
    </div>
  </aside>

  <main class="main">
    <div class="results-bar">
      <span id="results-label">Toutes les questions</span>
    </div>
    <div class="q-grid" id="q-list"></div>
  </main>
</div>

<div class="modal-overlay" id="preview-modal" onclick="closePreview(event)">
  <div class="modal">
    <div class="modal-header">
      <span>Prévisualisation du cahier</span>
      <button class="modal-close" onclick="closePreviewBtn()">×</button>
    </div>
    <div class="modal-body" id="preview-body"></div>
    <div class="modal-footer">
      <button class="btn-vider" onclick="closePreviewBtn()">Fermer</button>
      <button class="btn-generer" style="background:#1B3B6F;color:#fff" onclick="closePreviewBtn();genererDocx(false)">⬇ Générer Cahier</button>
      <button class="btn-generer" style="background:var(--paper-3);color:var(--ink)" onclick="closePreviewBtn();genererDocx(true)">⬇ Générer Guide</button>
    </div>
  </div>
</div>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">×</button>
  <img id="lightbox-img" src="" alt="">
</div>

<div class="panier-bar" id="panier-bar">
  <div class="panier-items" id="panier-items"></div>
  <div class="panier-actions">
    <span class="panier-count" id="panier-count">0 / 10</span>
    <button class="btn-vider" onclick="viderPanier()">Vider</button>
    <button class="btn-generer" style="background:rgba(255,255,255,0.15);color:var(--paper);border:1px solid rgba(255,255,255,0.4)" onclick="previsualiser(false)">👁 Cahier</button>
    <button class="btn-generer" style="background:rgba(255,255,255,0.15);color:var(--paper);border:1px solid rgba(255,255,255,0.4)" onclick="previsualiser(true)">👁 Guide</button>
    <button class="btn-generer" id="btn-generer" onclick="genererDocx(false)">⬇ Générer Cahier</button>
    <button class="btn-generer" id="btn-generer-guide" style="background:var(--paper-3);color:var(--ink)" onclick="genererDocx(true)">⬇ Générer Guide</button>
  </div>
</div>

<div class="warn-toast" id="warn-toast"></div>

<script src="docx.js"></script>
<script src="questions.js"></script>
<script src="contexte.js"></script>
<script src="app.js"></script>
</body>
</html>
